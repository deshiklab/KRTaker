<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KRTaker — Super Admin Panel</title>
<style>
:root{
  --primary:#2F80ED; --primary-dark:#1E5EB8; --primary-light:#E8F1FD;
  --accent:#27AE60; --warn:#E67E22; --danger:#E74C3C;
  --bg:#F2F5FA; --bg-alt:#F6F9FE; --bg-dark:#0F1B2D;
  --text:#1A2433; --text-soft:#5B6B83; --text-mute:#8A97AB;
  --border:#E4EAF3; --card:#FFFFFF;
  --grad:linear-gradient(135deg,#2F80ED 0%,#1E5EB8 100%);
  --shadow:0 10px 30px rgba(47,128,237,.10);
  --radius:14px;
  --font:'Inter','Hind Siliguri',system-ui,-apple-system,sans-serif;
  --sidebar-w:252px;
}
[data-theme="dark"]{
  --bg:#0E1626; --bg-alt:#121C30; --card:#16203A;
  --text:#E8EEF9; --text-soft:#A8B6CF; --text-mute:#7483A0;
  --border:#243350; --primary-light:rgba(47,128,237,.16);
  --shadow:0 10px 30px rgba(0,0,0,.35);
}
*{margin:0;padding:0;box-sizing:border-box}
:root{--scroll-thumb:rgba(138,151,171,.38);--scroll-thumb-h:rgba(138,151,171,.62)}
[data-theme="dark"]{--scroll-thumb:rgba(138,151,171,.3);--scroll-thumb-h:rgba(138,151,171,.55)}
*{scrollbar-width:thin;scrollbar-color:var(--scroll-thumb) transparent}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--scroll-thumb);border-radius:99px;border:2px solid transparent;background-clip:padding-box}
::-webkit-scrollbar-thumb:hover{background:var(--scroll-thumb-h);border:2px solid transparent;background-clip:padding-box}
.sidebar{scrollbar-color:rgba(255,255,255,.22) transparent}
.sidebar ::-webkit-scrollbar-thumb{background:rgba(255,255,255,.18);border:2px solid transparent;background-clip:padding-box}
.sidebar ::-webkit-scrollbar-thumb:hover{background:rgba(255,255,255,.32);border:2px solid transparent;background-clip:padding-box}
body{font-family:var(--font);color:var(--text);background:var(--bg);line-height:1.6;font-size:15px;-webkit-font-smoothing:antialiased}
a{color:var(--primary);text-decoration:none}
button{font-family:inherit;cursor:pointer}
input,select,textarea{font-family:inherit;font-size:13px;color:var(--text);background:var(--bg-alt);border:1px solid var(--border);border-radius:10px;padding:9px 12px;outline:none;transition:border .15s;width:100%}
input:focus,select:focus,textarea:focus{border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-light)}
textarea{min-height:74px;resize:vertical}
label.lb{display:block;font-size:11.5px;font-weight:600;color:var(--text-soft);margin-bottom:5px;letter-spacing:.1px}
.btn-primary{display:inline-flex;align-items:center;gap:7px;background:var(--grad);color:#fff;border:none;border-radius:10px;padding:9px 16px;font-size:13px;font-weight:600;box-shadow:0 8px 22px rgba(47,128,237,.30);transition:all .15s}
.btn-primary:hover{transform:translateY(-2px)}
.btn-primary:disabled{opacity:.6;cursor:not-allowed;transform:none}
.btn-outline{display:inline-flex;align-items:center;gap:7px;border:1px solid #C9D8EE;color:var(--primary);background:var(--card);border-radius:10px;padding:9px 16px;font-size:13px;font-weight:600;transition:all .15s}
.btn-outline:hover{background:var(--primary-light);border-color:var(--primary)}
[data-theme="dark"] .btn-outline{background:transparent;border-color:var(--border)}
.btn-ghost{display:inline-flex;align-items:center;gap:7px;background:none;border:none;color:var(--text-soft);border-radius:10px;padding:8px 12px;font-size:12.5px;font-weight:600}
.btn-ghost:hover{color:var(--primary);background:var(--primary-light)}
.btn-danger{display:inline-flex;align-items:center;gap:6px;background:rgba(231,76,60,.1);color:var(--danger);border:1px solid rgba(231,76,60,.25);border-radius:9px;padding:7px 12px;font-size:12px;font-weight:700}
.btn-danger:hover{background:var(--danger);color:#fff}
.badge{display:inline-flex;align-items:center;gap:5px;font-size:10.5px;font-weight:700;border-radius:999px;padding:3px 10px;letter-spacing:.2px;white-space:nowrap}
.badge::before{content:'';width:5px;height:5px;border-radius:50%;background:currentColor}
.b-green{background:rgba(39,174,96,.12);color:#1E8A4C}
.b-blue{background:var(--primary-light);color:var(--primary-dark)}
.b-orange{background:rgba(230,126,34,.13);color:#C05F12}
.b-red{background:rgba(231,76,60,.12);color:#C0392B}
.b-gray{background:rgba(138,151,171,.14);color:var(--text-soft)}
.b-purple{background:rgba(155,89,182,.12);color:#8E44AD}
[data-theme="dark"] .b-green{color:#4CD68A}
[data-theme="dark"] .b-blue{color:#7EB3F5}
[data-theme="dark"] .b-orange{color:#F5A25D}
[data-theme="dark"] .b-red{color:#F07B6E}
[data-theme="dark"] .b-purple{color:#C39BD3}
.app{display:flex;min-height:100vh}
.app.side-mini{--sidebar-w:66px}
.app.side-mini .sidebar .sb-brand{justify-content:center;padding:18px 0 14px;gap:0}
.app.side-mini .sb-brand .bn,.app.side-mini .sb-brand .bs{display:none}
.app.side-mini .sb-group{display:none}
.app.side-mini .sb-item{justify-content:center;padding:10px 0;gap:0}
.app.side-mini .sb-item .txt,.app.side-mini .sb-item .chip{display:none}
.app.side-mini .sb-item.active::before{left:8px;right:8px;top:0;bottom:auto;width:auto;height:3px;border-radius:0 0 4px 4px}
.app.side-mini .sb-scroll{padding:12px 6px 18px}
.app.side-mini .sb-user{justify-content:center;padding:8px 0;gap:0}
.app.side-mini .sb-user .un,.app.side-mini .sb-user .ur,.app.side-mini .sb-bottom .btn-ghost{display:none}
.side-toggle{display:inline-flex}
.sidebar{width:var(--sidebar-w);background:var(--bg-dark);color:#CBD5E6;display:flex;flex-direction:column;position:fixed;inset:0 auto 0 0;z-index:60;transition:width .2s ease,transform .22s}
.sb-brand{display:flex;align-items:center;gap:11px;padding:18px 18px 14px;border-bottom:1px solid rgba(255,255,255,.08)}
.sb-logo{width:38px;height:38px;border-radius:11px;background:var(--grad);color:#fff;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:800;flex-shrink:0}
.sb-brand .bn{color:#fff;font-size:14px;font-weight:800;line-height:1.15}
.sb-brand .bs{font-size:10.5px;opacity:.7}
.sb-scroll{flex:1;overflow-y:auto;padding:12px 10px 18px}
.sb-group{font-size:10px;font-weight:700;letter-spacing:1.2px;text-transform:uppercase;color:#6B7C96;padding:16px 10px 6px}
.sb-item{display:flex;align-items:center;gap:10px;padding:8.5px 11px;border-radius:9px;color:#B9C6DA;font-size:13px;font-weight:500;cursor:pointer;transition:all .13s;position:relative;border:1px solid transparent}
.sb-item:hover{background:rgba(255,255,255,.06);color:#fff}
.sb-item.active{background:var(--primary-light);color:var(--primary);font-weight:600}
[data-theme="dark"] .sb-item.active{color:#7EB3F5}
.sb-item.active::before{content:'';position:absolute;left:-10px;top:7px;bottom:7px;width:3.5px;border-radius:0 4px 4px 0;background:var(--grad)}
.sb-item .ic{width:24px;text-align:center;font-size:14px}
.sb-item .chip{margin-left:auto;font-size:10px;font-weight:700;background:var(--danger);color:#fff;border-radius:999px;padding:1px 7px}
.sb-bottom{padding:12px;border-top:1px solid rgba(255,255,255,.08)}
.sb-user{display:flex;align-items:center;gap:10px;padding:8px 6px}
.sb-ava{width:34px;height:34px;border-radius:10px;background:var(--grad);color:#fff;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;flex-shrink:0}
.sb-user .un{color:#fff;font-size:12.5px;font-weight:700;line-height:1.2}
.sb-user .ur{font-size:10.5px;opacity:.7}
.sb-backdrop{position:fixed;inset:0;background:rgba(10,20,40,.45);z-index:55;opacity:0;pointer-events:none;transition:opacity .2s}
.main{flex:1;margin-left:var(--sidebar-w);display:flex;flex-direction:column;min-width:0;transition:margin-left .2s ease}
.topbar{position:sticky;top:0;z-index:50;background:rgba(255,255,255,.92);backdrop-filter:blur(14px);border-bottom:1px solid var(--border);padding:0 28px}
[data-theme="dark"] .topbar{background:rgba(14,22,38,.92)}
.topbar-in{display:flex;align-items:center;gap:14px;height:62px;max-width:1240px;margin:0 auto}
.tb-title{font-size:15px;font-weight:800;letter-spacing:-.2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tb-actions{margin-left:auto;display:flex;align-items:center;gap:8px}
.icon-btn{background:var(--primary-light);border:1px solid var(--border);color:var(--primary-dark);border-radius:9px;padding:7px 11px;font-size:12px;font-weight:700;cursor:pointer;transition:all .15s;line-height:1;display:inline-flex;align-items:center;gap:6px}
[data-theme="dark"] .icon-btn{color:#7EB3F5}
.menu-toggle{display:none;background:none;border:1px solid var(--border);border-radius:9px;width:38px;height:38px;font-size:16px;color:var(--text)}
.content{padding:26px 28px 60px;max-width:1240px;width:100%;margin:0 auto}
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;flex-wrap:wrap;margin-bottom:22px}
.page-head h1{font-size:23px;font-weight:800;letter-spacing:-.4px;line-height:1.2}
.page-head .sub{font-size:13px;color:var(--text-mute);margin-top:3px}
.head-actions{display:flex;gap:9px;flex-wrap:wrap}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px;margin-bottom:20px}
.stat{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:16px 17px;box-shadow:var(--shadow);position:relative;overflow:hidden;transition:transform .18s ease}
.stat:hover{transform:translateY(-3px)}
.stat::after{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:var(--grad);opacity:0;transition:opacity .18s}
.stat:hover::after{opacity:1}
.stat .s-label{font-size:11px;font-weight:600;color:var(--text-mute);letter-spacing:.2px;display:flex;align-items:center;gap:7px}
.stat .s-ico{width:26px;height:26px;border-radius:8px;background:var(--primary-light);display:inline-flex;align-items:center;justify-content:center;font-size:13px}
.stat .s-value{font-size:22px;font-weight:800;letter-spacing:-.5px;margin-top:7px;line-height:1.15}
.stat .s-trend{font-size:11px;font-weight:600;margin-top:5px;color:var(--text-mute)}
.stat .s-trend.up{color:var(--accent)}
.stat .s-trend.down{color:var(--danger)}
.panel{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden;margin-bottom:18px}
.panel-h{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 18px;border-bottom:1px solid var(--border)}
.panel-h .t{font-size:13.5px;font-weight:700;display:flex;align-items:center;gap:8px}
.panel-h .t .pi{width:26px;height:26px;border-radius:8px;background:var(--primary-light);display:inline-flex;align-items:center;justify-content:center;font-size:13px}
.panel-b{padding:16px 18px}
.tbl-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px;min-width:640px}
thead th{text-align:left;font-size:10.5px;font-weight:700;letter-spacing:.8px;text-transform:uppercase;color:var(--text-mute);padding:11px 16px;border-bottom:1px solid var(--border);background:var(--bg-alt);white-space:nowrap}
tbody td{padding:11px 16px;border-bottom:1px solid var(--border);color:var(--text-soft);vertical-align:middle}
tbody tr:last-child td{border-bottom:none}
tbody tr{transition:background .12s}
tbody tr:hover{background:var(--bg-alt)}
td .c-name{font-weight:600;color:var(--text);font-size:13px}
td .c-sub{font-size:11.5px;color:var(--text-mute)}
.row-actions{display:flex;gap:6px;justify-content:flex-end}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:13px}
.grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:13px}
.grid-4{display:grid;grid-template-columns:repeat(4,1fr);gap:13px}
.grid-dash{display:grid;grid-template-columns:1.5fr 1fr;gap:18px}
.frm{display:flex;flex-direction:column;gap:12px}
.frm .full{grid-column:1/-1}
.kv{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 0;border-bottom:1px dashed var(--border);font-size:13px}
.kv:last-child{border-bottom:none}
.kv .k{color:var(--text-soft)}
.kv .v{font-weight:700}
.kv .v.pos{color:var(--accent)}
.kv .v.neg{color:var(--danger)}
.mix-row{display:flex;justify-content:space-between;align-items:center;padding:7px 0;border-bottom:1px dashed var(--border);font-size:13px}
.mix-row:last-child{border-bottom:none}
.mix-row b{font-weight:800}
.mix-total{background:var(--primary-light);border-radius:10px;margin-top:6px;padding:8px 12px;font-weight:800}
.empty{padding:26px;text-align:center;color:var(--text-mute);font-size:13px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:5px 11px;border-radius:999px;background:var(--bg-alt);border:1px solid var(--border);font-size:11.5px;font-weight:600;margin:0 6px 6px 0}
.chip.on{background:var(--primary-light);border-color:rgba(47,128,237,.3);color:var(--primary)}
.chip .del{cursor:pointer;color:var(--text-mute);font-weight:800;padding:0 2px}
.chip .del:hover{color:var(--danger)}
.toast-wrap{position:fixed;top:18px;right:18px;z-index:999;display:flex;flex-direction:column;gap:8px}
.toast{background:var(--card);border:1px solid var(--border);border-left:4px solid var(--primary);border-radius:12px;padding:11px 16px;font-size:13px;font-weight:600;box-shadow:0 14px 40px rgba(10,25,50,.18);transition:opacity .3s;min-width:230px;max-width:360px}
.toast.ok{border-left-color:var(--accent)}
.toast.error{border-left-color:var(--danger)}
.drawer-overlay{position:fixed;inset:0;background:rgba(10,20,40,.45);backdrop-filter:blur(3px);z-index:120;display:flex;justify-content:flex-end;opacity:0;pointer-events:none;transition:opacity .22s}
.drawer-overlay.open{opacity:1;pointer-events:auto}
.drawer{width:min(560px,100vw);height:100%;background:var(--card);border-left:1px solid var(--border);box-shadow:-18px 0 60px rgba(10,25,50,.28);display:flex;flex-direction:column;transform:translateX(102%);transition:transform .24s ease}
.drawer.open{transform:none}
.drawer-h{display:flex;align-items:center;gap:10px;padding:15px 20px;border-bottom:1px solid var(--border)}
.drawer-h .dh-t{font-size:14.5px;font-weight:800;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.drawer-h .close{background:none;border:none;font-size:16px;color:var(--text-mute);cursor:pointer;width:30px;height:30px;border-radius:9px}
.drawer-h .close:hover{background:var(--primary-light);color:var(--primary)}
.drawer-b{flex:1;overflow-y:auto;padding:18px 20px 26px}
.drawer-f{padding:14px 20px;border-top:1px solid var(--border);background:var(--bg-alt)}
.dr-actions{display:flex;gap:9px;justify-content:flex-end;flex-wrap:wrap}
.overlay{position:fixed;inset:0;background:rgba(10,20,40,.5);backdrop-filter:blur(4px);z-index:90;display:none;align-items:flex-start;justify-content:center;padding:6vh 18px;overflow-y:auto}
.overlay.open{display:flex}
.modal{background:var(--card);border:1px solid var(--border);border-radius:18px;width:100%;max-width:640px;box-shadow:0 30px 80px rgba(10,25,50,.3);animation:pop .2s ease}
@keyframes pop{from{transform:translateY(14px);opacity:0}to{transform:none;opacity:1}}
.modal-h{padding:18px 22px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px}
.modal-h .t{font-size:16px;font-weight:800}
.modal-h .close{margin-left:auto;background:none;border:none;font-size:17px;color:var(--text-mute)}
.modal-b{padding:20px 22px 24px;max-height:70vh;overflow-y:auto}
.auth{position:fixed;inset:0;z-index:200;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:20px}
.auth-card{width:100%;max-width:400px;background:var(--card);border:1px solid var(--border);border-radius:20px;box-shadow:0 30px 80px rgba(10,25,50,.25);padding:34px 32px}
.auth-logo{width:52px;height:52px;border-radius:15px;background:var(--grad);color:#fff;display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:800;margin-bottom:16px}
.auth h2{font-size:20px;font-weight:800;letter-spacing:-.4px}
.auth .as{font-size:12.5px;color:var(--text-mute);margin:4px 0 20px}
.auth label.lb{margin-top:12px}
.auth .err{color:var(--danger);font-size:12px;font-weight:600;margin-top:10px;display:none}
.auth .err.show{display:block}
@media(max-width:900px){
  .sidebar{transform:translateX(-100%)}
  .sidebar.open{transform:none;box-shadow:20px 0 60px rgba(0,0,0,.35)}
  .main{margin-left:0}
  .menu-toggle{display:block}
  .side-toggle{display:none}
  .sb-backdrop.show{opacity:1;pointer-events:auto}
  .tbl-wrap{-webkit-overflow-scrolling:touch}
  .content{padding:20px 16px 60px}
}
@media(max-width:720px){
  .grid-2,.grid-3,.grid-4,.grid-dash{grid-template-columns:1fr}
}
@media(max-width:640px){
  body{font-size:14px}
  input,select,textarea{font-size:16px}
  .topbar{padding:0 12px}
  .topbar-in{height:56px;gap:10px}
  .tb-title{font-size:13.5px}
  .tb-actions .lbl{display:none}
  .menu-toggle{width:40px;height:40px}
  .content{padding:16px 14px 70px}
  .page-head{margin-bottom:16px;gap:10px}
  .page-head h1{font-size:19px}
  .head-actions{width:100%}
  .head-actions .btn-primary,.head-actions .btn-outline{flex:1;justify-content:center}
  .stat{padding:13px 14px}
  .stat .s-value{font-size:19px}
  .panel-h{padding:12px 14px}
  .panel-h .t{font-size:13px}
  .panel-b{padding:13px 14px}
  .tbl-wrap{overflow-x:auto}
  table{min-width:520px}
  thead th{padding:9px 10px;font-size:10px}
  tbody td{padding:9px 10px;font-size:12.5px}
  .kv,.mix-row{font-size:12.5px}
  .empty{padding:20px}
  .auth{padding:12px}
  .auth-card{padding:26px 20px}
  .toast-wrap{left:12px;right:12px;top:12px;align-items:stretch}
  .toast{min-width:0;max-width:none;width:100%}
  .drawer-b{padding:14px 14px 22px}
  .drawer-f{padding:12px 14px}
  .dr-actions .btn-primary,.dr-actions .btn-outline{flex:1;justify-content:center}
  .overlay{padding:12px}
  .modal-b{padding:16px}
  .sb-item{padding:10px 11px}
  .row-actions{gap:2px}
  .row-actions .btn-ghost{padding:7px 9px}
}
</style>
</head>
<body>

<div id="authScreen" class="auth">
  <div class="auth-card">
    <div class="auth-logo">KR</div>
    <h2>Super Admin Panel</h2>
    <div class="as">KRTaker platform administration · authorised operators only</div>
    <label class="lb" for="authEmail">Email</label>
    <input id="authEmail" type="email" placeholder="kabir@krtaker.com" autocomplete="off">
    <label class="lb" for="authPass">Password</label>
    <input id="authPass" type="password" placeholder="••••••••">
    <div class="err" id="authErr"></div>
    <div style="margin-top:18px"><button class="btn-primary" id="authBtn" style="width:100%;justify-content:center" onclick="doLogin()">Log in</button></div>
  </div>
</div>

<div id="app" class="app" style="display:none">
  <div class="sb-backdrop" id="sbBackdrop" onclick="closeSidebar()"></div>
  <aside class="sidebar" id="sidebar">
    <div class="sb-brand">
      <div class="sb-logo">KR</div>
      <div><div class="bn" id="sbBrand">KRTaker</div><div class="bs">Super Admin</div></div>
    </div>
    <div class="sb-scroll" id="sbNav"></div>
    <div class="sb-bottom">
      <div class="sb-user">
        <div class="sb-ava" id="sbAva">SA</div>
        <div style="flex:1;min-width:0"><div class="un" id="sbName">—</div><div class="ur" id="sbRole">Super Admin</div></div>
        <button class="btn-ghost" style="color:#8FA2BE" onclick="doLogout()" title="Log out">⎋</button>
      </div>
    </div>
  </aside>
  <div class="main">
    <header class="topbar">
      <div class="topbar-in">
        <button class="menu-toggle" onclick="toggleSidebar()">☰</button>
        <div class="tb-title" id="tbTitle">Super Admin</div>
        <div class="tb-actions">
          <button class="icon-btn side-toggle" id="sideToggle" onclick="toggleSideMini()" title="Toggle sidebar">⫷</button>
          <button class="icon-btn" onclick="toggleTheme()">🌙</button>
          <a class="icon-btn" href="dashboard-v2.html" target="_blank">↗<span class="lbl"> Dashboard</span></a>
        </div>
      </div>
    </header>
    <main class="content" id="content"></main>
  </div>
</div>

<div class="drawer-overlay" id="drawerOverlay" onclick="if(event.target===this)closeDrawer()">
  <div class="drawer" id="drawer">

<script>
const API='../api/';
let TOKEN=''; try{TOKEN=localStorage.getItem('krtaker_admin_token')||'';}catch(e){}
let LIVE={user:null};
let STATE={view:'dashboard',theme:localStorage.getItem('krtaker_admin_theme')||'light'};
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=n=>'৳'+Math.round(n).toLocaleString('en-IN');
const moneyC=n=>{const a=Math.abs(n);let s=a>=10000000?(a/10000000).toFixed(2)+'Cr':a>=100000?(a/100000).toFixed(1)+'L':Math.round(a).toLocaleString('en-IN');return(n<0?'−':'')+'৳'+s;};
function toast(msg,type){const d=document.createElement('div');const t=type==='ok'||type==='success'?'ok':(type==='error'?'error':'info');d.className='toast '+t;d.textContent=msg;$('toastWrap').appendChild(d);setTimeout(()=>{d.style.opacity='0';setTimeout(()=>d.remove(),300)},2800)}
function badge(st){const map={'active':'b-green','Active':'b-green','Paid':'b-green','Success':'b-green','Resolved':'b-green','Closed':'b-green','OK':'b-green','ready':'b-green','trial':'b-purple','Trial':'b-purple','pending':'b-orange','Pending':'b-orange','suspended':'b-orange','Suspended':'b-orange','Open':'b-red','cancelled':'b-gray','Cancelled':'b-gray','In Progress':'b-blue','Answered':'b-blue','High':'b-red','Urgent':'b-red','Normal':'b-blue','Low':'b-gray','disabled':'b-gray','unconfigured':'b-orange','active':'b-green'};return`<span class="badge ${map[st]||'b-gray'}">${esc(st)}</span>`}
function openDrawer(title,body,foot){$('drawerTitle').textContent=title;$('drawerBody').innerHTML=body;$('drawerFoot').innerHTML=foot||'';$('drawerOverlay').classList.add('open');$('drawer').classList.add('open');}
function closeDrawer(){$('drawerOverlay').classList.remove('open');$('drawer').classList.remove('open');}
function closeSidebar(){$('sidebar').classList.remove('open');$('sbBackdrop').classList.remove('show');}
function toggleSidebar(){$('sidebar').classList.toggle('open');$('sbBackdrop').classList.toggle('show');}
let SIDE_MINI=false;try{SIDE_MINI=localStorage.getItem('krtaker_admin_side')==='mini'}catch(e){}
function applySideMini(){if(SIDE_MINI)$('app').classList.add('side-mini');const t=$('sideToggle');if(t)t.textContent=SIDE_MINI?'⫸':'⫷';}
function toggleSideMini(){SIDE_MINI=!SIDE_MINI;$('app').classList.toggle('side-mini',SIDE_MINI);const t=$('sideToggle');if(t)t.textContent=SIDE_MINI?'⫸':'⫷';try{localStorage.setItem('krtaker_admin_side',SIDE_MINI?'mini':'full')}catch(e){}}
applySideMini();
function toggleTheme(){STATE.theme=STATE.theme==='dark'?'light':'dark';document.documentElement.setAttribute('data-theme',STATE.theme);localStorage.setItem('krtaker_admin_theme',STATE.theme);$('tbTitle').textContent='';renderTitle();toast(STATE.theme==='dark'?'Dark mode on':'Light mode on')}
async function api(path,data){
  const opts={method:data?'POST':'GET',headers:{}};
  if(data)opts.headers['Content-Type']='application/json';
  if(TOKEN)opts.headers['Authorization']='Bearer '+TOKEN;
  if(data)opts.body=JSON.stringify(data);
  const res=await fetch(API+path,opts);
  return res.json().catch(()=>({ok:false,error:'Parse error'}));
}
async function admin(data){return api('app-admin',data)}
function renderTitle(){const t=NAV[STATE.view]||{};$('tbTitle').textContent=(t.ic||'')+' '+(t.l||'Super Admin')}
function renderNav(){

    ['Platform',['subscribers','packages','users','providers']],

}
const NAV={
  dashboard:{ic:'📊',l:'Dashboard'},
  subscribers:{ic:'👥',l:'Subscribers'},
  packages:{ic:'📦',l:'Packages'},
  users:{ic:'👤',l:'User Management'},
  providers:{ic:'🛠️',l:'Service Providers'},
  cms:{ic:'🌐',l:'Web CMS'},
  onboarding:{ic:'🎧',l:'Onboarding & CRM'},
  mis:{ic:'📈',l:'MIS Reports'},

function render(){

function pageHead(sub,actions){if(sub)$('pageSub').textContent=sub;if(actions)$('pageActions').innerHTML=actions;}
function load(el,html){const e=$(el);if(e)e.innerHTML=html;}

/* ── Dashboard ── */
const MONTHS=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const mLabel=m=>{const mm=+(String(m||'').slice(5));return MONTHS[mm-1]||String(m).slice(5)||'—'};
function barChartSVG(rows,opt){
  opt=opt||{};
  const W=opt.w||560,H=opt.h||176,padT=22,padB=30;
  const vals=rows.map(r=>+(r.n??r.amt??0));
  const max=Math.max(1,...vals);
  const step=(W-24)/Math.max(1,rows.length);
  const bw=Math.max(9,Math.min(34,step*0.52));
  const inner=H-padT-padB;
  let s='';
  rows.forEach((r,i)=>{
    const v=+(r.n??r.amt??0);
    const h=Math.max(2,v/max*inner);
    const x=12+i*step+(step-bw)/2,y=H-padB-h;
    s+=`<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${bw.toFixed(1)}" rx="4" height="${h.toFixed(1)}" fill="${opt.color||'var(--primary)'}" opacity="0.92"/>`+
       `<text x="${(x+bw/2).toFixed(1)}" y="${(y-6).toFixed(1)}" text-anchor="middle" font-size="10" font-weight="700" fill="${opt.tc||'var(--text-soft)'}">${opt.fmt?opt.fmt(v):v}</text>`+
       `<text x="${(x+bw/2).toFixed(1)}" y="${H-10}" text-anchor="middle" font-size="9.5" fill="var(--text-mute)">${opt.ml?opt.ml(r):mLabel(r.m)}</text>`;
  });
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;display:block">${s}</svg>`;
}
function hbarChart(rows,opt){
  opt=opt||{};
  if(!rows.length)return '<div class="empty">No data yet.</div>';
  const max=Math.max(...rows.map(r=>+(r.n??0)),1);
  return `<div style="display:flex;flex-direction:column;gap:11px">`+rows.map(r=>{
    const pct=Math.max(2,Math.round((+(r.n??0))/max*100));
    return `<div><div style="display:flex;justify-content:space-between;align-items:baseline;font-size:12px;margin-bottom:4px"><span style="color:var(--text-soft);font-weight:600">${esc(r.m??r.plan??r.status??r.role??'—')}</span><span style="color:var(--text);font-weight:800">${r.n}</span></div><div style="height:9px;background:var(--bg-alt);border:1px solid var(--border);border-radius:99px;overflow:hidden"><div style="width:${pct}%;height:100%;border-radius:99px;background:${opt.color||'var(--primary)'}"></div></div></div>`;
  }).join('')+`</div>`;
}
function donutChart(rows){
  const total=rows.reduce((s,r)=>s+(+(r.n??0)),0);
  if(!total)return '<div class="empty">No tickets yet.</div>';
  const colors={'Open':'#E74C3C','In Progress':'#2F80ED','Answered':'#27AE60','Resolved':'#27AE60','Closed':'#8A97AB','Pending':'#E67E22'};
  const CX=72,CY=72,R=50,SW=19;
  let acc=0,segs='';
  rows.forEach(r=>{
    const v=+(r.n??0);const frac=v/total;
    const a0=acc*2*Math.PI-Math.PI/2,a1=(acc+frac)*2*Math.PI-Math.PI/2;
    acc+=frac;
    const large=frac>0.5?1:0;
    const x0=CX+R*Math.cos(a0),y0=CY+R*Math.sin(a0),x1=CX+R*Math.cos(a1),y1=CY+R*Math.sin(a1);
    if(v>0)segs+=`<path d="M${x0.toFixed(1)} ${y0.toFixed(1)} A${R} ${R} 0 ${large} 1 ${x1.toFixed(1)} ${y1.toFixed(1)}" fill="none" stroke="${colors[r.status]||'var(--primary)'}" stroke-width="${SW}" stroke-linecap="round"/>`;
  });
  const legend=rows.map(r=>`<div style="display:flex;align-items:center;gap:8px;font-size:12px;color:var(--text-soft)"><span style="width:11px;height:11px;border-radius:4px;background:${colors[r.status]||'var(--primary)'};flex-shrink:0"></span>${esc(r.status)}<b style="color:var(--text);margin-left:auto">${r.n}</b></div>`).join('');
  return `<div style="display:flex;align-items:center;gap:20px;flex-wrap:wrap"><svg viewBox="0 0 ${CX*2} ${CY*2}" style="width:150px;height:150px;flex-shrink:0">${segs}<text x="${CX}" y="${CY+1}" text-anchor="middle" font-size="21" font-weight="800" fill="var(--text)">${total}</text><text x="${CX}" y="${CY+16}" text-anchor="middle" font-size="9" fill="var(--text-mute)">tickets</text></svg><div style="flex:1;min-width:130px;display:flex;flex-direction:column;gap:8px">${legend}</div></div>`;
}
async function renderDashboard(){
  load('pageBody','<div class="c-sub" style="color:var(--text-mute);padding:20px">Loading…</div>');
  const [d,m]=await Promise.all([admin({action:'overview'}),admin({action:'mis'})]);
  if(!d.ok){load('pageBody',`<div class="empty">${esc(d.error||'Failed')}</div>`);return}
  const s=d.stats, mis=m.ok?(m.mis||{}):{};
  pageHead(`Platform at a glance · ${s.subscribers} subscribers · MRR ${moneyC(s.mrr)}`,
    `<button class="btn-primary" onclick="nav('subscribers')">＋ Subscriber</button><button class="btn-outline" onclick="nav('tickets')">🎫 Ticket</button><button class="btn-outline" onclick="nav('backup')">💾 Backup</button><button class="btn-outline" onclick="nav('cms')">🌐 CMS</button>`);
  const cards=[
    ['👥','Subscribers',s.subscribers,`+${s.new_subs_30d} in 30d · ${s.active} active`],
    ['🟣','Trial',s.trial,'awaiting conversion'],
    ['💰','MRR',moneyC(s.mrr),'ARR '+moneyC(s.arr)],
    ['📦','Packages',s.packages,'catalog'],
    ['👤','Staff users',s.users,'app_users'],
    ['🎫','Open tickets',s.tickets_open,s.tickets_open?'needs attention':'all clear'],
    ['🧲','Leads',s.leads,'platform CRM'],
    ['🧊','DB size',(s.db_size/1048576).toFixed(1)+' MB',s.tables+' tables · '+s.files+' files']
  ];
  const signups=mis.signups_by_month||[],premium=mis.premium_by_month||[],tix=mis.tickets_by_status||[],plans=mis.subscribers_by_plan||[];
  const recent=(s.recent_subs||[]).slice(0,6),audit=s.audit||[];
  const pnl=(ico,t,body)=>`<div class="panel"><div class="panel-h"><span class="t"><span class="pi">${ico}</span>${t}</span></div><div class="panel-b">${body}</div></div>`;
  load('pageBody',
    `<div class="stats">${cards.map(c=>`<div class="stat"><div class="s-label"><span class="s-ico">${c[0]}</span>${c[1]}</div><div class="s-value">${c[2]}</div><div class="s-trend">${c[3]}</div></div>`).join('')}</div>`+
    `<div class="grid-2" style="gap:18px">${pnl('📈','Signups by month',signups.length?barChartSVG(signups):'<div class="empty">No signups yet.</div>')}${pnl('💰','Subscription revenue by month',premium.length?barChartSVG(premium,{color:'var(--accent)',tc:'#1E8A4C',fmt:moneyC}):'<div class="empty">No revenue yet.</div>')}</div>`+
    `<div class="grid-2" style="gap:18px">${pnl('📦','Subscribers by plan',hbarChart(plans))}${pnl('🎫','Tickets by status',donutChart(tix))}</div>`+
    `<div class="grid-2" style="gap:18px">${pnl('🆕','Recent subscribers',recent.length?`<div class="tbl-wrap"><table style="min-width:0"><thead><tr><th>Subscriber</th><th>Plan</th><th>Status</th><th>Joined</th></tr></thead><tbody>${recent.map(x=>`<tr><td><div class="c-name">${esc(x.name)}</div><div class="c-sub">${esc(x.email)}</div></td><td>${x.plan?badge(x.plan):'—'}</td><td>${badge(x.status)}</td><td class="c-sub">${esc((x.created_at||'').slice(0,10))}</td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">No subscribers yet.</div>')}${pnl('🕒','Recent activity',audit.length?audit.map(a=>`<div class="kv"><span class="k">${esc(a.user)} · ${esc(a.action)} <span style="color:var(--text-mute);font-size:11px">${esc(a.module)}</span></span><span class="v" style="font-size:11.5px;color:var(--text-mute)">${esc(a.ts||'').slice(0,16)}</span></div>`).join(''):'<div class="empty">No activity yet.</div>')}</div>`);
}

let SUBS={list:[],plans:[]};

  SUBS={list:d.subscribers||[],plans:d.plans||[]};
  load('pageBody',`<div class="panel"><div class="tbl-wrap"><table><thead><tr><th>ID</th><th>Subscriber</th><th>Plan</th><th>Role</th><th>Status</th><th>Trial end</th><th>Created</th><th></th></tr></thead><tbody>${SUBS.list.map(s=>`<tr><td>#${s.id}</td><td><div class="c-name">${esc(s.name)}</div><div class="c-sub">${esc(s.email)}${s.phone?' · '+esc(s.phone):''}</div></td><td>${s.plan?badge(s.plan):'—'}</td><td>${esc(s.role||'owner')}</td><td>${badge(s.status)}</td><td class="c-sub">${esc(s.trial_end||'—')}</td><td class="c-sub">${esc((s.created_at||'').slice(0,10))}</td><td><div class="row-actions"><button class="btn-ghost" onclick="subscriberForm(${s.id})">✎</button><button class="btn-ghost" style="color:var(--danger)" onclick="subscriberDelete(${s.id})">🗑</button></div></td></tr>`).join('')||'<tr><td colspan="8"><div class="empty">No subscribers.</div></td></tr>'}</tbody></table></div></div>`);
}
function subscriberForm(id){
  const s=id?SUBS.list.find(x=>x.id===id):{id:0,name:'',org:'',email:'',phone:'',plan:'',role:'owner',status:'pending',trial_end:''};
  openDrawer(id?'Edit subscriber #'+id:'New subscriber',
    `<div class="frm"><div class="grid-2"><div><label class="lb">Name</label><input id="sf_name" value="${esc(s.name)}"></div><div><label class="lb">Org</label><input id="sf_org" value="${esc(s.org)}"></div></div>
     <div class="grid-2"><div><label class="lb">Email</label><input id="sf_email" value="${esc(s.email)}"></div><div><label class="lb">Phone</label><input id="sf_phone" value="${esc(s.phone)}"></div></div>
     <div class="grid-2"><div><label class="lb">Plan</label><select id="sf_plan"><option value="">— none —</option>${SUBS.plans.map(p=>`<option value="${esc(p.code)}" ${s.plan===p.code?'selected':''}>${esc(p.name)} (${esc(p.code)})</option>`).join('')}</select></div><div><label class="lb">Role</label><select id="sf_role">${['owner','manager','tenant','accountant','crm','hr','legal','svc_mgr','partner'].map(r=>`<option ${s.role===r?'selected':''}>${r}</option>`).join('')}</select></div></div>
     <div class="grid-2"><div><label class="lb">Status</label><select id="sf_status">${['pending','trial','active','suspended','cancelled'].map(st=>`<option ${s.status===st?'selected':''}>${st}</option>`).join('')}</select></div><div><label class="lb">Trial end (YYYY-MM-DD)</label><input id="sf_trial" value="${esc(s.trial_end||'')}" placeholder="2026-08-31"></div></div></div>`,
    `<div class="dr-actions"><button class="btn-ghost" onclick="closeDrawer()">Cancel</button><button class="btn-primary" onclick="subscriberSave(${id})">💾 Save</button></div>`);
}
async function subscriberSave(id){
  const d=await admin({action:'subscriber-save',id,name:$('sf_name').value.trim(),org:$('sf_org').value.trim(),email:$('sf_email').value.trim(),phone:$('sf_phone').value.trim(),plan:$('sf_plan').value,role:$('sf_role').value,status:$('sf_status').value,trial_end:$('sf_trial').value.trim()});
  if(d.ok){toast('Subscriber saved','ok');closeDrawer();renderSubscribers();}else toast(d.error||'Failed','error');
}
async function subscriberDelete(id){
  if(!confirm('Delete subscriber #'+id+'?'))return;
  const d=await admin({action:'subscriber-delete',id});
  if(d.ok){toast('Subscriber deleted','ok');renderSubscribers();}else toast(d.error||'Failed','error');
}

let PKG_CUR=null;
function packageMatrix(code){
  const p=PKG.list.find(x=>x.code===code);if(!p)return;PKG_CUR=code;
  const mods=p.modules||{};
  openDrawer('Module matrix — '+code+' (role × module access)',
    `<div class="frm">${PKG.roles.map(r=>{const sel=mods[r]||[];return `<div><label class="lb">${esc(r)}</label><div style="display:flex;flex-wrap:wrap;gap:5px">${PKG.registry.map(m=>`<label style="display:inline-flex;align-items:center;gap:5px;font-size:11.5px;padding:4px 9px;border:1px solid var(--border);border-radius:999px;cursor:pointer;background:${sel.includes(m.id)?'var(--primary-light)':'var(--bg-alt)'}" class="mx-${esc(r)}"><input type="checkbox" data-role="${esc(r)}" data-mod="${esc(m.id)}" ${sel.includes(m.id)?'checked':''} style="width:auto;accent-color:var(--primary)"> ${esc(m.id)}</label>`).join('')}</div></div>`}).join('')}</div>`,
    `<div class="dr-actions"><button class="btn-ghost" onclick="closeDrawer()">Cancel</button><button class="btn-primary" onclick="packageMatrixSave()">💾 Save matrix</button></div>`);
}
async function packageMatrixSave(){
  const mods={};
  PKG.roles.forEach(r=>{mods[r]=[...document.querySelectorAll('input[data-role="'+r+'"]:checked')].map(c=>c.dataset.mod);});
  const d=await api('app-packages',{action:'save',code:PKG_CUR,name:PKG.list.find(x=>x.code===PKG_CUR).name,price:PKG.list.find(x=>x.code===PKG_CUR).price,seats:PKG.list.find(x=>x.code===PKG_CUR).seats,tag:PKG.list.find(x=>x.code===PKG_CUR).tag||'',features:PKG.list.find(x=>x.code===PKG_CUR).features||[],modules:mods,limits:PKG.list.find(x=>x.code===PKG_CUR).limits||{}});

function packageLimits(code){

let PKG_SUBS=[];
async function packageAssign(code){
  const d=await api('app-packages',{action:'subscribers'});
  if(!d.ok)return;
  PKG_SUBS=d.subscribers||[];
  PKG_CUR=code;
  openDrawer('Assign subscribers → '+code,
    `<div class="frm">${PKG_SUBS.map(s=>`<div style="display:flex;align-items:center;gap:10px;border:1px solid var(--border);border-radius:10px;padding:9px 12px"><input type="checkbox" id="asg_${s.id}" style="width:auto" ${s.plan===code?'checked':''}><div style="flex:1;min-width:0"><div class="c-name" style="font-size:13px">${esc(s.name)}</div><div class="c-sub">${esc(s.email)} · now: ${esc(s.plan||'—')}</div></div></div>`).join('')||'<div class="empty">No subscribers.</div>'}</div>`,
    `<div class="dr-actions"><button class="btn-ghost" onclick="closeDrawer()">Cancel</button><button class="btn-primary" onclick="packageAssignSave()">💾 Assign</button></div>`);
}
async function packageAssignSave(){
  let done=0;
  for(const s of PKG_SUBS){
    const on=document.getElementById('asg_'+s.id)&&document.getElementById('asg_'+s.id).checked;
    if(on&&s.plan!==PKG_CUR){const d=await api('app-packages',{action:'assign',subscriber_id:s.id,plan:PKG_CUR});if(d.ok)done++;}
  }
  toast('Assigned '+done+' subscriber(s) to '+PKG_CUR,'ok');closeDrawer();renderPackages();
}

let CMS={blocks:[],defKeys:new Set(),tab:'home'};
const CMS_PAGES={home:{l:'Home',ic:'🏠'},features:{l:'Features',ic:'✨'},pricing:{l:'Pricing',ic:'💎'},about:{l:'About',ic:'ℹ️'},contact:{l:'Contact',ic:'📮'},footer:{l:'Footer',ic:'🔗'},seo:{l:'SEO',ic:'🔍'}};
const CMS_SEC_LABEL={hero:'Hero',cta:'Call to action',section:'Section heading',cards:'Feature cards',social:'Social links',home:'Home',features:'Features',pricing:'Pricing',about:'About',contact:'Contact',footer:'Footer'};
const CMS_LONG=['subtitle','desc','meta_description','tagline','address'];
function cmsIsLong(k){return CMS_LONG.some(s=>k.includes(s));}
async function renderCms(){
  pageHead('Web CMS — landing content, SEO and section management',
    `<button class="btn-outline" onclick="cmsPreview()">👁 Preview</button><a class="btn-outline" href="https://krtaker.com" target="_blank">↗ Landing</a><button class="btn-primary" onclick="cmsSaveAll()">💾 Save all</button>`);
  load('pageBody','<div class="empty">Loading…</div>');
  const d=await admin({action:'cms-get'});
  if(!d.ok){load('pageBody',`<div class="empty">${esc(d.error||'Failed')}</div>`);return}
  CMS.blocks=d.blocks||[];
  CMS.defKeys=new Set(CMS.blocks.filter(b=>b.is_default).map(b=>b.page+'|'+b.section+'|'+b.k));
  const cur=CMS_PAGES[CMS.tab]?CMS.tab:'home';
  load('pageBody',
    `<div style="display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-bottom:16px">`+
    Object.keys(CMS_PAGES).map(p=>`<button class="chip ${cur===p?'on':''}" onclick="cmsTab('${p}')">${CMS_PAGES[p].ic} ${CMS_PAGES[p].l}</button>`).join('')+
    `<input id="cmsSearch" placeholder="🔍 Search blocks…" style="max-width:200px;margin-left:auto" oninput="cmsFilter()"></div>`+
    `<div id="cmsPanels">${cmsPageHtml(cur)}</div>`);
}
function cmsTab(p){CMS.tab=p;renderCms();}
function cmsFilter(){
  const q=$('cmsSearch').value.trim().toLowerCase();
  document.querySelectorAll('#cmsPanels [data-cms]').forEach(el=>{
    const hay=(el.getAttribute('data-cms')+' '+(el.value||'')).toLowerCase();
    const field=el.closest('.cms-field');if(field)field.style.display=(!q||hay.includes(q))?'':'none';
  });
}
function cmsPageHtml(p){
  const blocks=CMS.blocks.filter(b=>b.page===p);
  const bySec={};blocks.forEach(b=>{(bySec[b.section]=bySec[b.section]||[]).push(b)});
  const secs=Object.keys(bySec);
  return `<div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px">
      <button class="btn-outline" onclick="cmsAddBlock('${p}','')">＋ Add field</button>
      <button class="btn-outline" style="color:var(--danger)" onclick="cmsResetPage('${p}')">↺ Reset page</button>
    </div>`+
    secs.map(sec=>`<div class="panel"><div class="panel-h"><span class="t"><span class="pi">${CMS_PAGES[p].ic}</span>${esc(CMS_SEC_LABEL[sec]||sec)}</span><span class="c-sub" style="font-size:11px">${bySec[sec].length} fields</span></div>
      <div class="panel-b"><div class="frm">${bySec[sec].map(b=>cmsFieldHtml(b)).join('')}</div></div></div>`).join('');
}
function cmsFieldHtml(b){
  const tag=b.page+'|'+b.section+'|'+b.k;
  const def=CMS.defKeys.has(tag);
  const long=cmsIsLong(b.k);
  const inp=long
    ? `<textarea data-cms="${esc(tag)}" oninput="cmsCount(this)">${esc(b.v)}</textarea>`
    : `<input data-cms="${esc(tag)}" value="${esc(b.v)}" oninput="cmsCount(this)">`;
  return `<div class="cms-field">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:5px">
      <label class="lb" style="margin:0;text-transform:capitalize">${esc(b.k.replace(/_/g,' '))}${def?'':'<span class="badge b-purple" style="margin-left:6px">custom</span>'}</label>
      ${def?'':`<button class="btn-ghost" style="color:var(--danger);padding:2px 6px;font-size:11px" onclick="cmsDelBlock('${esc(b.page)}','${esc(b.section)}','${esc(b.k)}')" title="Remove block">✕</button>`}
    </div>
    ${inp}
    <div class="c-sub" style="font-size:10.5px;text-align:right;margin-top:3px"><span class="cms-cnt">${esc(b.v).length}</span> chars</div>
  </div>`;
}
function cmsCount(el){const c=el.parentElement.querySelector('.cms-cnt');if(c)c.textContent=el.value.length;}
async function cmsSaveAll(){
  const blocks=CMS.blocks.map(b=>{const el=document.querySelector(`[data-cms="${b.page}|${b.section}|${b.k}"]`);return {...b,v:el?el.value:b.v}});
  const d=await admin({action:'cms-save',blocks});
  if(d.ok){toast('CMS content saved','ok');renderCms();}else toast(d.error||'Failed','error');
}
function cmsAddBlock(p,sec){
  openDrawer('Add custom field',
    `<div class="frm">
      <div><label class="lb">Page</label><input value="${esc(p)}" disabled></div>
      <div><label class="lb">Section</label><input id="cb_sec" value="${esc(sec)}" placeholder="e.g. hero, cta, section"></div>
      <div><label class="lb">Key (lowercase slug — e.g. button_text)</label><input id="cb_key" placeholder="button_text"></div>
      <div><label class="lb">Value</label><textarea id="cb_val"></textarea></div>
    </div>`,
    `<div class="dr-actions"><button class="btn-ghost" onclick="closeDrawer()">Cancel</button><button class="btn-primary" onclick="cmsAddBlockSave('${esc(p)}')">＋ Add field</button></div>`);
}
async function cmsAddBlockSave(p){
  const sec=$('cb_sec').value.trim(),k=$('cb_key').value.trim(),v=$('cb_val').value;
  if(!sec||!k){toast('Section and key are required','error');return}
  if(!/^[a-z0-9_]+$/.test(k)){toast('Key must be lowercase (a-z, 0-9, _)','error');return}
  if(CMS.blocks.some(b=>b.page===p&&b.section===sec&&b.k===k)){toast('That block already exists','error');return}
  const d=await admin({action:'cms-save',blocks:[{page:p,section:sec,k,v}]});
  if(d.ok){toast('Custom field added','ok');closeDrawer();renderCms();}else toast(d.error||'Failed','error');
}
async function cmsDelBlock(p,sec,k){
  if(!confirm('Remove custom field '+k+'?'))return;
  const d=await admin({action:'cms-delete',page:p,section:sec,k});
  if(d.ok){toast('Field removed','ok');renderCms();}else toast(d.error||'Failed','error');
}
async function cmsResetPage(p){
  if(!confirm('Reset all '+CMS_PAGES[p].l+' fields to defaults?'))return;
  const d=await admin({action:'cms-reset',page:p});
  if(d.ok){toast(CMS_PAGES[p].l+' page reset to defaults','ok');renderCms();}else toast(d.error||'Failed','error');
}
function cmsVal(p,s,k){
  const el=document.querySelector(`[data-cms="${p}|${s}|${k}"]`);
  if(el)return el.value;
  const b=CMS.blocks.find(x=>x.page===p&&x.section===s&&x.k===k);
  return b?b.v:'';
}

    `<div class="dr-actions"><button class="btn-ghost" onclick="closeDrawer()">Cancel</button><button class="btn-primary" onclick="ticketReplySave('${esc(id)}')">📨 Send reply</button></div>`);
}
async function ticketReplySave(id){
  const d=await admin({action:'ticket-reply',id,reply:$('tk_reply').value.trim()});
  if(d.ok){toast('Reply sent — ticket Answered','ok');closeDrawer();renderTickets();}else toast(d.error||'Failed','error');
}
function ticketStatus(id){
  const t=TKTS.find(x=>x.id===id)||{};
  openDrawer('Update ticket — '+id,
    `<div class="frm"><div><label class="lb">Status</label><select id="ts_status">${['Open','In Progress','Answered','Resolved','Closed'].map(s=>`<option ${t.status===s?'selected':''}>${s}</option>`).join('')}</select></div>
     <div><label class="lb">Priority</label><select id="ts_prio">${['Low','Normal','High','Urgent'].map(p=>`<option ${t.prio===p?'selected':''}>${p}</option>`).join('')}</select></div>
     <div><label class="lb">Assignee</label><input id="ts_assignee" value="${esc(t.assignee||'')}"></div></div>`,
    `<div class="dr-actions"><button class="btn-ghost" onclick="closeDrawer()">Cancel</button><button class="btn-primary" onclick="ticketStatusSave('${esc(id)}')">💾 Update</button></div>`);

async function ticketStatusSave(id){
  const d=await admin({action:'ticket-status',id,status:$('ts_status').value,prio:$('ts_prio').value,assignee:$('ts_assignee').value.trim()});
  if(d.ok){toast('Ticket updated','ok');closeDrawer();renderTickets();}else toast(d.error||'Failed','error');
}
async function ticketDelete(id){
  if(!confirm('Delete ticket '+id+'?'))return;
  const d=await admin({action:'ticket-delete',id});
  if(d.ok){toast('Ticket deleted','ok');renderTickets();}else toast(d.error||'Failed','error');
}
/* ── Backup ── */
async function renderBackup(){
  pageHead('Database snapshots, download and full JSON export',`<button class="btn-primary" onclick="backupRun()">📸 Run snapshot</button>`);
  load('pageBody','<div class="empty">Loading…</div>');
  const d=await admin({action:'backup-list'});
  if(!d.ok){load('pageBody',`<div class="empty">${esc(d.error||'Failed')}</div>`);return}
  load('pageBody',
    `<div class="stats">${[['📸','Snapshots',(d.backups||[]).length,'backup_log'],['⬇️','Download DB','.db','full SQLite'],['📦','Export JSON','_tables','PG-ready']].map(c=>`<div class="stat"><div class="s-label"><span class="s-ico">${c[0]}</span>${c[1]}</div><div class="s-value">${c[2]}</div><div class="s-trend">${c[3]}</div></div>`).join('')}</div>
     <div class="panel"><div class="panel-h"><span class="t"><span class="pi">💾</span>Download / export</span></div><div class="panel-b" style="display:flex;gap:10px;flex-wrap:wrap"><button class="btn-outline" onclick="backupDownload()">⬇️ Download database (.db)</button><button class="btn-outline" onclick="backupExport()">📦 Export full JSON</button><button class="btn-outline" onclick="nav('health')">🩺 System health</button></div></div>
     <div class="panel"><div class="panel-h"><span class="t"><span class="pi">📜</span>Snapshot history</span></div><div class="tbl-wrap"><table><thead><tr><th>#</th><th>Kind</th><th>Size</th><th>When</th><th>Note</th></tr></thead><tbody>${(d.backups||[]).map(b=>`<tr><td>${b.id}</td><td>${badge(b.kind)}</td><td>${(b.size/1048576).toFixed(1)} MB</td><td class="c-sub">${esc(b.ts)}</td><td class="c-sub">${esc(b.note||'')}</td></tr>`).join('')||'<tr><td colspan="5"><div class="empty">No snapshots yet.</div></td></tr>'}</tbody></table></div></div>`);
}
async function backupRun(){
  const d=await admin({action:'backup-run'});
  if(d.ok){toast('Snapshot recorded ('+(d.size/1048576).toFixed(1)+' MB)','ok');renderBackup();}else toast(d.error||'Failed','error');
}
function backupDownload(){
  const a=document.createElement('a');
  a.href=API+'app-backup';
  const opts={headers:{}};if(TOKEN)opts.headers['Authorization']='Bearer '+TOKEN;
  fetch(a.href,opts).then(r=>r.blob()).then(b=>{const u=URL.createObjectURL(b);const d=document.createElement('a');d.href=u;d.download='krtaker_'+new Date().toISOString().slice(0,19).replace(/[:T]/g,'')+'.db';d.click();URL.revokeObjectURL(u);toast('Database download started','ok')}).catch(()=>toast('Download failed','error'));
}
function backupExport(){
  const a=document.createElement('a');
  a.href=API+'app-export';
  const opts={headers:{}};if(TOKEN)opts.headers['Authorization']='Bearer '+TOKEN;
  fetch(a.href,opts).then(r=>r.blob()).then(b=>{const u=URL.createObjectURL(b);const d=document.createElement('a');d.href=u;d.download='krtaker_export_'+new Date().toISOString().slice(0,10)+'.json';d.click();URL.revokeObjectURL(u);toast('JSON export started','ok')}).catch(()=>toast('Export failed','error'));
}
/* ── Modules ── */
async function renderModules(){
  pageHead('Module & service management — registry is linked to package formulation (Packages → 🧩 matrix)');
  load('pageBody','<div class="empty">Loading…</div>');
  const d=await admin({action:'modules'});
  if(!d.ok){load('pageBody',`<div class="empty">${esc(d.error||'Failed')}</div>`);return}
  const reg=d.registry||[],pkg=d.packages||[];
  load('pageBody',
    `<div class="stats">${[['🧩','Registry modules',reg.length,'built + roadmap'],['📦','Packages',pkg.length,'catalog'],['🔄','Matrix editable','Packages','role × module'],['🔜','Roadmap slots',reg.filter(m=>!m.built).length,'parking → insurance']].map(c=>`<div class="stat"><div class="s-label"><span class="s-ico">${c[0]}</span>${c[1]}</div><div class="s-value">${c[2]}</div><div class="s-trend">${c[3]}</div></div>`).join('')}</div>
     <div class="panel"><div class="panel-h"><span class="t"><span class="pi">🧩</span>Module registry</span></div><div class="panel-b"><div style="display:flex;flex-wrap:wrap;gap:6px">${reg.map(m=>`<span class="chip ${m.built?'on':''}">${esc(m.id)}${m.built?'':' 🔜'}</span>`).join('')}</div><div class="c-sub" style="margin-top:10px">Built modules are live. Roadmap slots (🔜) appear in the package matrix but are not built yet.</div></div></div>
     <div class="panel"><div class="panel-h"><span class="t"><span class="pi">📦</span>Package module coverage</span></div><div class="tbl-wrap"><table><thead><tr><th>Package</th><th>Roles configured</th><th>Owner modules</th><th>Manager modules</th><th>Tenant modules</th></tr></thead><tbody>${pkg.map(p=>{const m=p.modules||{};return `<tr><td class="c-name">${esc(p.name)} <span class="c-sub">(${esc(p.code)})</span></td><td>${Object.keys(m).length}</td><td class="c-sub">${(m.owner||[]).length} mods</td><td class="c-sub">${(m.manager||[]).length} mods</td><td class="c-sub">${(m.tenant||[]).length} mods</td></tr>`}).join('')||'<tr><td colspan="5"><div class="empty">No packages.</div></td></tr>'}</tbody></table></div></div>`);
}
/* ── White Label ── */

  load('pageBody','<div class="empty">Loading…</div>');
  const d=await admin({action:'whitelabel-get'});
  if(!d.ok){load('pageBody',`<div class="empty">${esc(d.error||'Failed')}</div>`);return}
  WL=d.whitelabel||{};
  load('pageBody',`<div class="panel"><div class="panel-b"><div class="frm grid-2">
    <div><label class="lb">Site name</label><input id="wl_site_name" value="${esc(WL.wl_site_name||'')}"></div>
    <div><label class="lb">Logo text (initials)</label><input id="wl_logo_text" value="${esc(WL.wl_logo_text||'')}"></div>
    <div><label class="lb">Primary color</label><input id="wl_primary_color" value="${esc(WL.wl_primary_color||'')}" placeholder="#2F80ED"></div>
    <div><label class="lb">Domain</label><input id="wl_domain" value="${esc(WL.wl_domain||'')}"></div>
    <div><label class="lb">Favicon URL</label><input id="wl_favicon" value="${esc(WL.wl_favicon||'')}"></div>
    <div><label class="lb">Login heading</label><input id="wl_login_heading" value="${esc(WL.wl_login_heading||'')}"></div>
    <div><label class="lb">Footer text</label><input id="wl_footer_text" value="${esc(WL.wl_footer_text||'')}"></div>

    <div><label class="lb">Theme</label><select id="wl_theme"><option value="light" ${WL.wl_theme==='light'?'selected':''}>Light</option><option value="dark" ${WL.wl_theme==='dark'?'selected':''}>Dark</option></select></div>

}
async function whitelabelSave(){
  const keys=Object.keys(WL);
  const whitelabel={};
  keys.forEach(k=>{const el=document.getElementById(k);if(el)whitelabel[k]=el.value;});
  const d=await admin({action:'whitelabel-save',whitelabel});
  if(d.ok){toast('White-label branding saved','ok');$('sbBrand').textContent=whitelabel.wl_site_name||'KRTaker';renderWhitelabel();}else toast(d.error||'Failed','error');
}

/* ── Audit ── */
async function renderAudit(){
  pageHead('Full audit trail — every significant action across the platform');
  load('pageBody','<div class="empty">Loading…</div>');

/* ── Auth ── */
async function doLogin(){
  const email=$('authEmail').value.trim().toLowerCase(),pass=$('authPass').value;
  const err=$('authErr');err.classList.remove('show');
  if(!email||!pass){err.textContent='Enter email and password.';err.classList.add('show');return}
  const btn=$('authBtn');btn.disabled=true;btn.textContent='Signing in…';
  try{
    const d=await api('app-login',{email,password:pass});
    if(d.ok&&d.token){
      if(d.user&&d.user.role!=='superadmin'){err.textContent='This account is not a Super Admin.';err.classList.add('show');btn.disabled=false;btn.textContent='Log in';return}
      TOKEN=d.token;try{localStorage.setItem('krtaker_admin_token',TOKEN)}catch(e){}
      LIVE.user=d.user;
      $('sbName').textContent=d.user.name; $('sbAva').textContent=(d.user.name||'SA').slice(0,2).toUpperCase();
      const wl=await admin({action:'whitelabel-get'});
      if(wl.ok&&wl.whitelabel.wl_site_name)$('sbBrand').textContent=wl.whitelabel.wl_site_name;
      $('authScreen').style.display='none';$('app').style.display='flex';
      renderNav();renderTitle();render();toast('Signed in as '+d.user.name);
    }else{err.textContent=d.error||'Login failed.';err.classList.add('show')}
  }catch(e){err.textContent='Network error.';err.classList.add('show')}
  btn.disabled=false;btn.textContent='Log in';
}
function doLogout(){
  TOKEN='';try{localStorage.removeItem('krtaker_admin_token')}catch(e){}
  $('app').style.display='none';$('authScreen').style.display='flex';
  toast('Signed out');
}
/* ── Boot ── */
document.documentElement.setAttribute('data-theme',STATE.theme);
(async function init(){
  if(!TOKEN){$('authScreen').style.display='flex';return}
  const d=await api('app-bootstrap');
  if(d.ok&&d.user){
    if(d.user.role!=='superadmin'){TOKEN='';try{localStorage.removeItem('krtaker_admin_token')}catch(e){};$('authScreen').style.display='flex';return}
    LIVE.user=d.user;
    $('sbName').textContent=d.user.name;$('sbAva').textContent=(d.user.name||'SA').slice(0,2).toUpperCase();
    const wl=await admin({action:'whitelabel-get'});
    if(wl.ok&&wl.whitelabel.wl_site_name)$('sbBrand').textContent=wl.whitelabel.wl_site_name;
    $('authScreen').style.display='none';$('app').style.display='flex';
    renderNav();renderTitle();render();
  }else{$('authScreen').style.display='flex'}
})();
$('authPass').addEventListener('keydown',e=>{if(e.key==='Enter')doLogin()});
</script>
