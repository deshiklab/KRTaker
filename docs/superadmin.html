<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KRTaker — Super Admin Panel</title>
<style>
:root{
  --primary:#2F80ED; --primary-dark:#1E5EB8; --primary-light:#E8F1FD;
  --accent:#27AE60; --warn:#E67E22; --danger:#E74C3C;
  --bg:#F2F5FA; --bg-alt:#F6F9FE; --bg-dark:#0F1B2D;
  --text:#1A2433; --text-soft:#5B6B83; --text-mute:#8A97AB;
  --border:#E4EAF3; --card:#FFFFFF;
  --grad:linear-gradient(135deg,#2F80ED 0%,#1E5EB8 100%);
  --shadow:0 10px 30px rgba(47,128,237,.10);
  --radius:14px;
  --font:'Inter','Hind Siliguri',system-ui,-apple-system,sans-serif;
  --sidebar-w:252px;
}
[data-theme="dark"]{
  --bg:#0E1626; --bg-alt:#121C30; --card:#16203A;
  --text:#E8EEF9; --text-soft:#A8B6CF; --text-mute:#7483A0;
  --border:#243350; --primary-light:rgba(47,128,237,.16);
  --shadow:0 10px 30px rgba(0,0,0,.35);
}
*{margin:0;padding:0;box-sizing:border-box}
:root{--scroll-thumb:rgba(138,151,171,.38);--scroll-thumb-h:rgba(138,151,171,.62)}
[data-theme="dark"]{--scroll-thumb:rgba(138,151,171,.3);--scroll-thumb-h:rgba(138,151,171,.55)}
*{scrollbar-width:thin;scrollbar-color:var(--scroll-thumb) transparent}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--scroll-thumb);border-radius:99px;border:2px solid transparent;background-clip:padding-box}
::-webkit-scrollbar-thumb:hover{background:var(--scroll-thumb-h);border:2px solid transparent;background-clip:padding-box}
.sidebar{scrollbar-color:rgba(255,255,255,.22) transparent}
.sidebar ::-webkit-scrollbar-thumb{background:rgba(255,255,255,.18);border:2px solid transparent;background-clip:padding-box}
.sidebar ::-webkit-scrollbar-thumb:hover{background:rgba(255,255,255,.32);border:2px solid transparent;background-clip:padding-box}
:root{--tip-bg:#1A2433;--tip-fg:#F2F5FA}
[data-theme="dark"]{--tip-bg:#E8EEF9;--tip-fg:#16203A}
.tip{position:fixed;z-index:500;background:var(--tip-bg);color:var(--tip-fg);font-size:11.5px;font-weight:600;line-height:1.4;padding:7px 11px;border-radius:8px;pointer-events:none;opacity:0;transform:translateY(4px);transition:opacity .12s,transform .12s;box-shadow:0 10px 30px rgba(10,25,50,.3);max-width:280px}
.tip.show{opacity:1;transform:none}
.sb-flyout{position:fixed;z-index:80;min-width:230px;max-width:290px;background:var(--card);border:1px solid var(--border);border-radius:12px;box-shadow:0 18px 50px rgba(10,25,50,.3);padding:14px 16px;opacity:0;pointer-events:none;transform:translateX(-6px);transition:opacity .15s,transform .15s}
.sb-flyout.show{opacity:1;pointer-events:auto;transform:none}
.sb-flyout .arrow{position:absolute;left:-5px;top:18px;width:10px;height:10px;background:var(--card);border-left:1px solid var(--border);border-bottom:1px solid var(--border);transform:rotate(45deg)}
.sb-flyout .fg{font-size:9.5px;font-weight:800;letter-spacing:1.2px;text-transform:uppercase;color:var(--text-mute);margin-bottom:6px}
.sb-flyout .ft{display:flex;align-items:center;gap:8px;font-size:13.5px;font-weight:800;color:var(--text)}
.sb-flyout .fd{font-size:11.5px;color:var(--text-soft);margin-top:5px;line-height:1.5}
.sb-flyout .fa{margin-top:9px;font-size:10.5px;font-weight:700;color:var(--primary)}
body{font-family:var(--font);color:var(--text);background:var(--bg);line-height:1.6;font-size:15px;-webkit-font-smoothing:antialiased}
a{color:var(--primary);text-decoration:none}
button{font-family:inherit;cursor:pointer}
input,select,textarea{font-family:inherit;font-size:13px;color:var(--text);background:var(--bg-alt);border:1px solid var(--border);border-radius:10px;padding:9px 12px;outline:none;transition:border .15s;width:100%}
input:focus,select:focus,textarea:focus{border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-light)}
textarea{min-height:74px;resize:vertical}
label.lb{display:block;font-size:11.5px;font-weight:600;color:var(--text-soft);margin-bottom:5px;letter-spacing:.1px}
.btn-primary{display:inline-flex;align-items:center;gap:7px;background:var(--grad);color:#fff;border:none;border-radius:10px;padding:9px 16px;font-size:13px;font-weight:600;box-shadow:0 8px 22px rgba(47,128,237,.30);transition:all .15s}
.btn-primary:hover{transform:translateY(-2px)}
.btn-primary:disabled{opacity:.6;cursor:not-allowed;transform:none}
.btn-outline{display:inline-flex;align-items:center;gap:7px;border:1px solid #C9D8EE;color:var(--primary);background:var(--card);border-radius:10px;padding:9px 16px;font-size:13px;font-weight:600;transition:all .15s}
.btn-outline:hover{background:var(--primary-light);border-color:var(--primary)}
[data-theme="dark"] .btn-outline{background:transparent;border-color:var(--border)}
.btn-ghost{display:inline-flex;align-items:center;gap:7px;background:none;border:none;color:var(--text-soft);border-radius:10px;padding:8px 12px;font-size:12.5px;font-weight:600}
.btn-ghost:hover{color:var(--primary);background:var(--primary-light)}
.btn-danger{display:inline-flex;align-items:center;gap:6px;background:rgba(231,76,60,.1);color:var(--danger);border:1px solid rgba(231,76,60,.25);border-radius:9px;padding:7px 12px;font-size:12px;font-weight:700}
.btn-danger:hover{background:var(--danger);color:#fff}
.badge{display:inline-flex;align-items:center;gap:5px;font-size:10.5px;font-weight:700;border-radius:999px;padding:3px 10px;letter-spacing:.2px;white-space:nowrap}
.badge::before{content:'';width:5px;height:5px;border-radius:50%;background:currentColor}
.b-green{background:rgba(39,174,96,.12);color:#1E8A4C}
.b-blue{background:var(--primary-light);color:var(--primary-dark)}
.b-orange{background:rgba(230,126,34,.13);color:#C05F12}
.b-red{background:rgba(231,76,60,.12);color:#C0392B}
.b-gray{background:rgba(138,151,171,.14);color:var(--text-soft)}
.b-purple{background:rgba(155,89,182,.12);color:#8E44AD}
[data-theme="dark"] .b-green{color:#4CD68A}
[data-theme="dark"] .b-blue{color:#7EB3F5}
[data-theme="dark"] .b-orange{color:#F5A25D}
[data-theme="dark"] .b-red{color:#F07B6E}
[data-theme="dark"] .b-purple{color:#C39BD3}
.app{display:flex;min-height:100vh}
.app.side-mini{--sidebar-w:66px}
.app.side-mini .sidebar .sb-brand{justify-content:center;padding:18px 0 14px;gap:0}
.app.side-mini .sb-brand .bn,.app.side-mini .sb-brand .bs{display:none}
.app.side-mini .sb-group{display:none}
.app.side-mini .sb-item{justify-content:center;padding:10px 0;gap:0}
.app.side-mini .sb-item .txt,.app.side-mini .sb-item .chip{display:none}
.app.side-mini .sb-item.active::before{left:8px;right:8px;top:0;bottom:auto;width:auto;height:3px;border-radius:0 0 4px 4px}
.app.side-mini .sb-scroll{padding:12px 6px 18px}
.app.side-mini .sb-user{justify-content:center;padding:8px 0;gap:0}
.app.side-mini .sb-user .un,.app.side-mini .sb-user .ur,.app.side-mini .sb-bottom .btn-ghost{display:none}
.side-toggle{display:inline-flex}
.sidebar{width:var(--sidebar-w);background:var(--bg-dark);color:#CBD5E6;display:flex;flex-direction:column;position:fixed;inset:0 auto 0 0;z-index:60;transition:width .2s ease,transform .22s}
.sb-brand{display:flex;align-items:center;gap:11px;padding:18px 18px 14px;border-bottom:1px solid rgba(255,255,255,.08)}
.sb-logo{width:38px;height:38px;border-radius:11px;background:var(--grad);color:#fff;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:800;flex-shrink:0}
.sb-brand .bn{color:#fff;font-size:14px;font-weight:800;line-height:1.15}
.sb-brand .bs{font-size:10.5px;opacity:.7}
.sb-scroll{flex:1;overflow-y:auto;padding:12px 10px 18px}
.sb-group{font-size:10px;font-weight:700;letter-spacing:1.2px;text-transform:uppercase;color:#6B7C96;padding:16px 10px 6px}
.sb-item{display:flex;align-items:center;gap:10px;padding:8.5px 11px;border-radius:9px;color:#B9C6DA;font-size:13px;font-weight:500;cursor:pointer;transition:all .13s;position:relative;border:1px solid transparent}
.sb-item:hover{background:rgba(255,255,255,.06);color:#fff}
.sb-item.active{background:var(--primary-light);color:var(--primary);font-weight:600}
[data-theme="dark"] .sb-item.active{color:#7EB3F5}
.sb-item.active::before{content:'';position:absolute;left:-10px;top:7px;bottom:7px;width:3.5px;border-radius:0 4px 4px 0;background:var(--grad)}
.sb-item .ic{width:24px;text-align:center;font-size:14px}
.sb-item .chip{margin-left:auto;font-size:10px;font-weight:700;background:var(--danger);color:#fff;border-radius:999px;padding:1px 7px}
.sb-bottom{padding:12px;border-top:1px solid rgba(255,255,255,.08)}
.sb-user{display:flex;align-items:center;gap:10px;padding:8px 6px}
.sb-ava{width:34px;height:34px;border-radius:10px;background:var(--grad);color:#fff;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;flex-shrink:0}
.sb-user .un{color:#fff;font-size:12.5px;font-weight:700;line-height:1.2}
.sb-user .ur{font-size:10.5px;opacity:.7}
.sb-backdrop{position:fixed;inset:0;background:rgba(10,20,40,.45);z-index:55;opacity:0;pointer-events:none;transition:opacity .2s}
.main{flex:1;margin-left:var(--sidebar-w);display:flex;flex-direction:column;min-width:0;transition:margin-left .2s ease}
.topbar{position:sticky;top:0;z-index:50;background:rgba(255,255,255,.92);backdrop-filter:blur(14px);border-bottom:1px solid var(--border);padding:0 28px}
[data-theme="dark"] .topbar{background:rgba(14,22,38,.92)}
.topbar-in{display:flex;align-items:center;gap:14px;height:62px;max-width:1240px;margin:0 auto}
.tb-title{font-size:15px;font-weight:800;letter-spacing:-.2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tb-actions{margin-left:auto;display:flex;align-items:center;gap:8px}
.gs-wrap{position:relative}
.gs-input{width:220px;background:var(--primary-light);border:1px solid var(--border);border-radius:9px;padding:8px 12px;font-size:12.5px;color:var(--text);outline:none;transition:all .15s}
.gs-input:focus{width:280px;border-color:var(--primary);box-shadow:0 0 0 3px rgba(47,128,237,.15)}
.gs-drop{position:absolute;top:calc(100% + 8px);right:0;width:min(560px,90vw);max-height:min(540px,70vh);overflow:auto;background:var(--bg);border:1px solid var(--border);border-radius:12px;box-shadow:0 18px 46px rgba(9,20,40,.22);z-index:200;padding:8px}
[data-theme="dark"] .gs-drop{box-shadow:0 18px 46px rgba(0,0,0,.55)}
.gs-group{font-size:10.5px;font-weight:800;letter-spacing:1px;text-transform:uppercase;color:var(--text-mute);padding:9px 10px 4px}
.gs-item{display:flex;align-items:flex-start;gap:9px;padding:8px 10px;border-radius:8px;cursor:pointer;font-size:12.5px}
.gs-item:hover,.gs-item.sel{background:var(--primary-light)}
.gs-item .gi{font-size:14px;line-height:1.4}
.gs-item .gt{font-weight:700;color:var(--text)}
.gs-item .gs{font-size:11px;color:var(--text-mute);margin-top:1px;word-break:break-word}
.gs-empty{padding:16px;text-align:center;font-size:12.5px;color:var(--text-mute)}
.gs-hint{display:flex;gap:10px;align-items:center;padding:8px 10px;font-size:11px;color:var(--text-mute);border-top:1px solid var(--border);margin-top:6px}
@media (max-width:720px){.gs-input{width:120px}.gs-input:focus{width:150px}.gs-drop{width:calc(100vw - 40px);right:-84px}}
.icon-btn{background:var(--primary-light);border:1px solid var(--border);color:var(--primary-dark);border-radius:9px;padding:7px 11px;font-size:12px;font-weight:700;cursor:pointer;transition:all .15s;line-height:1;display:inline-flex;align-items:center;gap:6px}
[data-theme="dark"] .icon-btn{color:#7EB3F5}
.menu-toggle{display:none;background:none;border:1px solid var(--border);border-radius:9px;width:38px;height:38px;font-size:16px;color:var(--text)}
.content{padding:26px 28px 60px;max-width:1240px;width:100%;margin:0 auto}
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;flex-wrap:wrap;margin-bottom:22px}
.page-head h1{font-size:23px;font-weight:800;letter-spacing:-.4px;line-height:1.2}
.page-head .sub{font-size:13px;color:var(--text-mute);margin-top:3px}
.head-actions{display:flex;gap:9px;flex-wrap:wrap}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px;margin-bottom:20px}
.stat{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:16px 17px;box-shadow:var(--shadow);position:relative;overflow:hidden;transition:transform .18s ease}
.stat:hover{transform:translateY(-3px)}
.stat::after{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:var(--grad);opacity:0;transition:opacity .18s}
.stat:hover::after{opacity:1}
.stat .s-label{font-size:11px;font-weight:600;color:var(--text-mute);letter-spacing:.2px;display:flex;align-items:center;gap:7px}
.stat .s-ico{width:26px;height:26px;border-radius:8px;background:var(--primary-light);display:inline-flex;align-items:center;justify-content:center;font-size:13px}
.stat .s-value{font-size:22px;font-weight:800;letter-spacing:-.5px;margin-top:7px;line-height:1.15}
.stat .s-trend{font-size:11px;font-weight:600;margin-top:5px;color:var(--text-mute)}
.stat .s-trend.up{color:var(--accent)}
.stat .s-trend.down{color:var(--danger)}
.panel{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden;margin-bottom:18px}
.panel-h{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 18px;border-bottom:1px solid var(--border)}
.panel-h .t{font-size:13.5px;font-weight:700;display:flex;align-items:center;gap:8px}
.panel-h .t .pi{width:26px;height:26px;border-radius:8px;background:var(--primary-light);display:inline-flex;align-items:center;justify-content:center;font-size:13px}
.panel-b{padding:16px 18px}
.tbl-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px;min-width:640px}
thead th{text-align:left;font-size:10.5px;font-weight:700;letter-spacing:.8px;text-transform:uppercase;color:var(--text-mute);padding:11px 16px;border-bottom:1px solid var(--border);background:var(--bg-alt);white-space:nowrap}
tbody td{padding:11px 16px;border-bottom:1px solid var(--border);color:var(--text-soft);vertical-align:middle}
tbody tr:last-child td{border-bottom:none}
tbody tr{transition:background .12s}
tbody tr:hover{background:var(--bg-alt)}
td .c-name{font-weight:600;color:var(--text);font-size:13px}
td .c-sub{font-size:11.5px;color:var(--text-mute)}
.row-actions{display:flex;gap:6px;justify-content:flex-end}
/* ── Table toolkit (v3.64): search bar + filters + sort + pagination ── */
.tbl-bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding:12px 16px;border-bottom:1px solid var(--border)}
.tbl-bar .tbl-q{flex:1;min-width:170px;max-width:280px}
.tbl-bar select{width:auto;min-width:120px;padding:7px 10px;font-size:12px}
.tbl-count{margin-left:auto;font-size:11.5px;color:var(--text-mute);white-space:nowrap}
.tbl-pager{display:flex;gap:8px;align-items:center;justify-content:flex-end;padding:10px 16px;flex-wrap:wrap}
.tbl-pg{min-width:30px;height:30px;padding:0 8px;border-radius:8px;border:1px solid var(--border);background:var(--card);color:var(--text-soft);font-size:12px;font-weight:600}
.tbl-pg.on{background:var(--primary);border-color:var(--primary);color:#fff}
.tbl-pg:disabled{opacity:.45;cursor:not-allowed}
.tbl-pg:not(:disabled):hover{background:var(--primary-light)}
.tbl-dot{color:var(--text-mute);padding:0 2px}
.tbl-ps{width:auto;padding:6px 10px;font-size:12px}
.tbl-s{cursor:pointer;user-select:none}
.tbl-s:hover{color:var(--primary)}
.tbl-s.on{color:var(--primary)}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:13px}
.grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:13px}
.grid-4{display:grid;grid-template-columns:repeat(4,1fr);gap:13px}
.grid-dash{display:grid;grid-template-columns:1.5fr 1fr;gap:18px}
.frm{display:flex;flex-direction:column;gap:12px}
.frm .full{grid-column:1/-1}
.kv{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 0;border-bottom:1px dashed var(--border);font-size:13px}
.kv:last-child{border-bottom:none}
.kv .k{color:var(--text-soft)}
.kv .v{font-weight:700}
.kv .v.pos{color:var(--accent)}
.kv .v.neg{color:var(--danger)}
.mix-row{display:flex;justify-content:space-between;align-items:center;padding:7px 0;border-bottom:1px dashed var(--border);font-size:13px}
.mix-row:last-child{border-bottom:none}
.mix-row b{font-weight:800}
.mix-total{background:var(--primary-light);border-radius:10px;margin-top:6px;padding:8px 12px;font-weight:800}
.empty{padding:26px;text-align:center;color:var(--text-mute);font-size:13px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:5px 11px;border-radius:999px;background:var(--bg-alt);border:1px solid var(--border);font-size:11.5px;font-weight:600;margin:0 6px 6px 0}
.chip.on{background:var(--primary-light);border-color:rgba(47,128,237,.3);color:var(--primary)}
.chip .del{cursor:pointer;color:var(--text-mute);font-weight:800;padding:0 2px}
.chip .del:hover{color:var(--danger)}
.toast-wrap{position:fixed;top:18px;right:18px;z-index:999;display:flex;flex-direction:column;gap:8px}
.toast{background:var(--card);border:1px solid var(--border);border-left:4px solid var(--primary);border-radius:12px;padding:11px 16px;font-size:13px;font-weight:600;box-shadow:0 14px 40px rgba(10,25,50,.18);transition:opacity .3s;min-width:230px;max-width:360px}
.toast.ok{border-left-color:var(--accent)}
.toast.error{border-left-color:var(--danger)}
.drawer-overlay{position:fixed;inset:0;background:rgba(10,20,40,.45);backdrop-filter:blur(3px);z-index:120;display:flex;justify-content:flex-end;opacity:0;pointer-events:none;transition:opacity .22s}
.drawer-overlay.open{opacity:1;pointer-events:auto}
.drawer{width:min(560px,100vw);height:100%;background:var(--card);border-left:1px solid var(--border);box-shadow:-18px 0 60px rgba(10,25,50,.28);display:flex;flex-direction:column;transform:translateX(102%);transition:transform .24s ease}
.drawer.open{transform:none}
.drawer-h{display:flex;align-items:center;gap:10px;padding:15px 20px;border-bottom:1px solid var(--border)}
.drawer-h .dh-t{font-size:14.5px;font-weight:800;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.drawer-h .close{background:none;border:none;font-size:16px;color:var(--text-mute);cursor:pointer;width:30px;height:30px;border-radius:9px}
.drawer-h .close:hover{background:var(--primary-light);color:var(--primary)}
.drawer-b{flex:1;overflow-y:auto;padding:18px 20px 26px}
.drawer-f{padding:14px 20px;border-top:1px solid var(--border);background:var(--bg-alt)}
.dr-actions{display:flex;gap:9px;justify-content:flex-end;flex-wrap:wrap}
.overlay{position:fixed;inset:0;background:rgba(10,20,40,.5);backdrop-filter:blur(4px);z-index:90;display:none;align-items:flex-start;justify-content:center;padding:6vh 18px;overflow-y:auto}
.overlay.open{display:flex}
.modal{background:var(--card);border:1px solid var(--border);border-radius:18px;width:100%;max-width:640px;box-shadow:0 30px 80px rgba(10,25,50,.3);animation:pop .2s ease}
@keyframes pop{from{transform:translateY(14px);opacity:0}to{transform:none;opacity:1}}
.modal-h{padding:18px 22px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px}
.modal-h .t{font-size:16px;font-weight:800}
.modal-h .close{margin-left:auto;background:none;border:none;font-size:17px;color:var(--text-mute)}
.modal-b{padding:20px 22px 24px;max-height:70vh;overflow-y:auto}
.auth{position:fixed;inset:0;z-index:200;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:20px}
.auth-card{width:100%;max-width:400px;background:var(--card);border:1px solid var(--border);border-radius:20px;box-shadow:0 30px 80px rgba(10,25,50,.25);padding:34px 32px}
.auth-logo{width:52px;height:52px;border-radius:15px;background:var(--grad);color:#fff;display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:800;margin-bottom:16px}
.auth h2{font-size:20px;font-weight:800;letter-spacing:-.4px}
.auth .as{font-size:12.5px;color:var(--text-mute);margin:4px 0 20px}
.auth label.lb{margin-top:12px}

<script>
const API='../api/';
let TOKEN=''; try{TOKEN=localStorage.getItem('krtaker_admin_token')||'';}catch(e){}
let LIVE={user:null};
let STATE={view:'dashboard',theme:localStorage.getItem('krtaker_admin_theme')||'light'};
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=n=>'৳'+Math.round(n).toLocaleString('en-IN');
const moneyC=n=>{const a=Math.abs(n);let s=a>=10000000?(a/10000000).toFixed(2)+'Cr':a>=100000?(a/100000).toFixed(1)+'L':Math.round(a).toLocaleString('en-IN');return(n<0?'−':'')+'৳'+s;};
function toast(msg,type){const d=document.createElement('div');const t=type==='ok'||type==='success'?'ok':(type==='error'?'error':'info');d.className='toast '+t;d.textContent=msg;$('toastWrap').appendChild(d);setTimeout(()=>{d.style.opacity='0';setTimeout(()=>d.remove(),300)},2800)}
function badge(st){const map={'active':'b-green','Active':'b-green','Paid':'b-green','Success':'b-green','Resolved':'b-green','Closed':'b-green','OK':'b-green','ready':'b-green','trial':'b-purple','Trial':'b-purple','pending':'b-orange','Pending':'b-orange','suspended':'b-orange','Suspended':'b-orange','Open':'b-red','cancelled':'b-gray','Cancelled':'b-gray','In Progress':'b-blue','Answered':'b-blue','High':'b-red','Urgent':'b-red','Normal':'b-blue','Low':'b-gray','disabled':'b-gray','unconfigured':'b-orange','active':'b-green'};return`<span class="badge ${map[st]||'b-gray'}">${esc(st)}</span>`}
function openDrawer(title,body,foot){$('drawerTitle').textContent=title;$('drawerBody').innerHTML=body;$('drawerFoot').innerHTML=foot||'';$('drawerOverlay').classList.add('open');$('drawer').classList.add('open');}
function closeDrawer(){$('drawerOverlay').classList.remove('open');$('drawer').classList.remove('open');}
function closeSidebar(){$('sidebar').classList.remove('open');$('sbBackdrop').classList.remove('show');}
function toggleSidebar(){$('sidebar').classList.toggle('open');$('sbBackdrop').classList.toggle('show');}
let SIDE_MINI=false;try{SIDE_MINI=localStorage.getItem('krtaker_admin_side')==='mini'}catch(e){}
function applySideMini(){if(SIDE_MINI)$('app').classList.add('side-mini');const t=$('sideToggle');if(t)t.textContent=SIDE_MINI?'⫸':'⫷';}
function toggleSideMini(){SIDE_MINI=!SIDE_MINI;$('app').classList.toggle('side-mini',SIDE_MINI);const t=$('sideToggle');if(t){t.textContent=SIDE_MINI?'⫸':'⫷';t.setAttribute('data-tip',SIDE_MINI?'Expand sidebar':'Collapse sidebar');}$('sbFlyout').classList.remove('show');try{localStorage.setItem('krtaker_admin_side',SIDE_MINI?'mini':'full')}catch(e){}}
applySideMini();
/* ── Sidebar hover flyout (mini mode) ── */
let FLY_T=null;
function sbFlyout(e){
  const it=e.target.closest('.sb-item');if(!it||!SIDE_MINI)return;
  clearTimeout(FLY_T);
  const f=$('sbFlyout');
  const r=it.getBoundingClientRect();
  f.innerHTML=`<div class="arrow"></div><div class="fg">${esc(it.dataset.group||'')}</div><div class="ft"><span>${(it.querySelector('.ic')||{}).textContent||''}</span>${esc(NAV[it.dataset.nav]?NAV[it.dataset.nav].l:'')}</div><div class="fd">${esc(it.dataset.desc||'')}</div><div class="fa">Click to open →</div>`;
  f.style.top=Math.max(10,Math.min(r.top,window.innerHeight-150))+'px';
  f.style.left=(r.right+6)+'px';
  f.classList.add('show');
}
function sbFlyoutHide(){const f=$('sbFlyout');if(f)f.classList.remove('show');}
function sbFlyoutDelayHide(){clearTimeout(FLY_T);FLY_T=setTimeout(sbFlyoutHide,220);}
document.addEventListener('mouseover',e=>{if(e.target.closest('.sb-item'))sbFlyout(e)});
document.addEventListener('mouseout',e=>{if(e.target.closest('.sb-item')&&!e.relatedTarget)sbFlyoutDelayHide()});
document.addEventListener('mouseover',e=>{if(e.target.closest('#sbFlyout'))clearTimeout(FLY_T)});
document.addEventListener('mouseout',e=>{if(e.target.closest('#sbFlyout'))sbFlyoutDelayHide()});
/* ── Global tooltip ── */
let TIP_T=null;
function tipShow(e){
  const t=e.target.closest('[data-tip]');if(!t)return;
  const el=$('tipEl');if(!el)return;
  el.textContent=t.getAttribute('data-tip');
  const r=t.getBoundingClientRect();
  let x,y;
  if(t.getAttribute('data-tip-pos')==='right'){x=r.right+10;y=r.top+r.height/2-el.offsetHeight/2;}
  else if(t.getAttribute('data-tip-pos')==='top'){x=r.left;y=r.top-el.offsetHeight-8;}
  else{x=r.left+r.width/2-el.offsetWidth/2;y=r.bottom+8;}
  x=Math.max(8,Math.min(x,window.innerWidth-el.offsetWidth-8));
  y=Math.max(8,Math.min(y,window.innerHeight-el.offsetHeight-8));
  el.style.left=Math.round(x)+'px';el.style.top=Math.round(y)+'px';
  el.classList.add('show');
  clearTimeout(TIP_T);
}
function tipHide(){clearTimeout(TIP_T);TIP_T=setTimeout(()=>{const el=$('tipEl');if(el)el.classList.remove('show')},70);}
document.addEventListener('mouseover',e=>{if(e.target.closest('[data-tip]'))tipShow(e)});
document.addEventListener('mouseout',e=>{if(e.target.closest('[data-tip]'))tipHide()});
function toggleTheme(){STATE.theme=STATE.theme==='dark'?'light':'dark';document.documentElement.setAttribute('data-theme',STATE.theme);localStorage.setItem('krtaker_admin_theme',STATE.theme);$('tbTitle').textContent='';renderTitle();toast(STATE.theme==='dark'?'Dark mode on':'Light mode on')}
async function api(path,data){
  const opts={method:data?'POST':'GET',headers:{}};
  if(data)opts.headers['Content-Type']='application/json';
  if(TOKEN)opts.headers['Authorization']='Bearer '+TOKEN;
  if(data)opts.body=JSON.stringify(data);
  const res=await fetch(API+path,opts);
  return res.json().catch(()=>({ok:false,error:'Parse error'}));
}
async function admin(data){return api('app-admin',data)}
/* ── SA1-fullsite-v3: Global search (topbar, Ctrl+K) ── */
let GS={q:'',groups:{},flat:[],sel:0,open:false,timer:null};
const GS_VIEW_LABEL={subscribers:'Subscribers',users:'Users',packages:'Packages',providers:'Providers',tickets:'Support tickets',leads:'Leads',cms:'Web CMS',finance:'Finance',audit:'Audit log'};
function gsOpen(){if(!GS.open){GS.open=true;const d=$('gsDrop');d.style.display='block';gsRender();}}
function gsClose(){GS.open=false;const d=$('gsDrop');if(d)d.style.display='none';}
function gsSearch(){
  clearTimeout(GS.timer);
  GS.q=$('gsInput').value.trim();
  if(GS.q.length<2){GS.groups={};GS.flat=[];gsRender();return;}
  GS.timer=setTimeout(async()=>{
    const d=await admin({action:'global-search',q:GS.q,limit:6});
    if(!d.ok){GS.groups={};GS.flat=[];gsRender();return;}
    GS.groups=d.groups||{};GS.flat=[];
    Object.keys(GS.groups).forEach(k=>GS.groups[k].forEach(r=>GS.flat.push({...r,__g:k})));
    GS.sel=0;gsRender();
  },220);
}
function gsRender(){
  const d=$('gsDrop');if(!d)return;
  const inp=$('gsInput');
  if(!GS.open){d.style.display='none';return;}
  d.style.display='block';
  const q=GS.q;
  if(q.length<2){d.innerHTML=`<div class="gs-empty">Type at least 2 characters to search across subscribers, users, packages, providers, tickets, leads, CMS blocks, finance and audit logs.</div>`;return;}
  const total=GS.flat.length;
  let html='';
  let gi=0;
  Object.keys(GS.groups).forEach(g=>{
    const rows=GS.groups[g]||[];
    html+=`<div class="gs-group">${GS_VIEW_LABEL[g]||g} · ${rows.length}</div>`+rows.map(r=>{
      const idx=gi++;
      return `<div class="gs-item ${idx===GS.sel?'sel':''}" onclick="gsGo(${idx})" onmouseenter="GS.sel=${idx};gsRender()">
        <span class="gi">${r.ic||'🔍'}</span>
        <span style="flex:1;min-width:0"><div class="gt">${esc(r.title)}</div><div class="gs">${esc(r.sub)}</div></span>
        <span style="font-size:10px;color:var(--text-mute);white-space:nowrap">↵</span></div>`;
    }).join('');
  });
  d.innerHTML=html||`<div class="gs-empty">No results for “${esc(q)}”.</div>`+
    `<div class="gs-hint"><span>${total} results · ↑↓ navigate · ↵ open · Esc close</span></div>`;
}
function gsKey(e){
  if((e.ctrlKey||e.metaKey)&&(e.key==='k'||e.key==='K')){e.preventDefault();const i=$('gsInput');i.focus();i.select();gsOpen();return;}
  const t=e.target;
  if(t&&t.id==='gsInput'){
    if(e.key==='ArrowDown'){e.preventDefault();if(GS.flat.length){GS.sel=(GS.sel+1)%GS.flat.length;gsRender();}}
    else if(e.key==='ArrowUp'){e.preventDefault();if(GS.flat.length){GS.sel=(GS.sel-1+GS.flat.length)%GS.flat.length;gsRender();}}
    else if(e.key==='Enter'){e.preventDefault();if(GS.flat[GS.sel])gsGo(GS.sel);}
    else if(e.key==='Escape'){gsClose();t.blur();}
  }else if(e.key==='Escape'&&GS.open){gsClose();}
}
document.addEventListener('keydown',gsKey);
document.addEventListener('click',e=>{if(!e.target.closest('.gs-wrap'))gsClose();});
function gsGo(idx){
  const r=GS.flat[idx];if(!r)return;
  gsClose();const i=$('gsInput');if(i)i.value='';
  GS_FOCUS=r;   // consumed by target view's renderer
  nav(r.view);
}
let GS_FOCUS=null;
function gsConsumeFocus(){
  const f=GS_FOCUS;GS_FOCUS=null;return f;
}
function gsHighlight(sel){
  const el=document.querySelector(sel);
  if(!el)return;
  el.style.transition='background .6s';
  el.style.background='rgba(47,128,237,.16)';
  el.scrollIntoView({behavior:'smooth',block:'center'});
  setTimeout(()=>{el.style.background='';},2200);
}
function renderTitle(){const t=NAV[STATE.view]||{};$('tbTitle').textContent=(t.ic||'')+' '+(t.l||'Super Admin')}
function renderNav(){
  const groups=[
    ['Overview',['dashboard']],
    ['Platform',['subscribers','packages','users','providers']],
    ['Content & CRM',['cms','blog','onboarding','mis']],
    ['Developers',['api','ai','webhooks','domains']],
    ['Commerce',['payments','finance']],
    ['System',['settings','integrations','tickets','backup','modules','whitelabel','health','audit']]
  ];
  $('sbNav').innerHTML=groups.map(g=>`<div class="sb-group">${g[0]}</div>`+g[1].map(k=>{const n=NAV[k];return `<div class="sb-item ${STATE.view===k?'active':''}" onclick="nav('${k}')" data-nav="${k}" data-group="${esc(g[0])}" data-desc="${esc(NAV_DESC[k]||'')}"><span class="ic">${n.ic}</span><span class="txt">${n.l}</span>${n.chip?`<span class="chip">${n.chip}</span>`:''}</div>`}).join('')).join('');
}
const NAV_DESC={
  dashboard:'Platform overview — KPIs, signups, revenue, tickets and recent activity',
  subscribers:'Manage platform subscribers — plans, status and trial windows',
  packages:'Create packages with role×module matrices, limits and subscriber assignments',

  dashboard:{ic:'📊',l:'Dashboard'},
  subscribers:{ic:'👥',l:'Subscribers'},
  packages:{ic:'📦',l:'Packages'},
  users:{ic:'👤',l:'User Management'},
  providers:{ic:'🛠️',l:'Service Providers'},
  cms:{ic:'🌐',l:'Web CMS'},
  blog:{ic:'📝',l:'Blog'},
  onboarding:{ic:'🎧',l:'Onboarding & CRM'},
  mis:{ic:'📈',l:'MIS Reports'},
  payments:{ic:'💳',l:'Payment Integrations'},
  finance:{ic:'💰',l:'Company Finance'},
  settings:{ic:'⚙️',l:'App Settings'},
  integrations:{ic:'🔌',l:'3rd-party Integrations'},
  tickets:{ic:'🎫',l:'Support & Ticketing'},
  backup:{ic:'💾',l:'Data Backup'},
  modules:{ic:'🧩',l:'Module Management'},
  whitelabel:{ic:'🏷️',l:'White Label'},

  audit:{ic:'📜',l:'Audit Logs'},
  api:{ic:'🧬',l:'API Library'},

};
function nav(v){closeSidebar();STATE.view=v;renderNav();renderTitle();render();window.scrollTo(0,0)}
function render(){
  const el=$('content');
  const r={dashboard:renderDashboard,subscribers:renderSubscribers,packages:renderPackages,users:renderUsers,providers:renderProviders,cms:renderCms,blog:renderBlog,onboarding:renderOnboarding,mis:renderMis,payments:renderPayments,finance:renderFinance,settings:renderSettings,integrations:renderIntegrations,tickets:renderTickets,backup:renderBackup,modules:renderModules,whitelabel:renderWhitelabel,health:renderHealth,audit:renderAudit,api:renderApi,ai:renderAi,webhooks:renderWebhooks,domains:renderDomains}[STATE.view];
  el.innerHTML=`<div class="page-head"><div><h1>${NAV[STATE.view].l}</h1><div class="sub" id="pageSub"></div></div><div class="head-actions" id="pageActions"></div></div><div id="pageBody"></div>`;
  r();
}
function pageHead(sub,actions){if(sub)$('pageSub').textContent=sub;if(actions)$('pageActions').innerHTML=actions;}
function load(el,html){const e=$(el);if(e)e.innerHTML=html;}

/* ── Dashboard ── */
const MONTHS=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const mLabel=m=>{const mm=+(String(m||'').slice(5));return MONTHS[mm-1]||String(m).slice(5)||'—'};
function barChartSVG(rows,opt){
  opt=opt||{};
  const W=opt.w||560,H=opt.h||176,padT=22,padB=30;
  const vals=rows.map(r=>+(r.n??r.amt??0));
  const max=Math.max(1,...vals);
  const step=(W-24)/Math.max(1,rows.length);
  const bw=Math.max(9,Math.min(34,step*0.52));
  const inner=H-padT-padB;
  let s='';
  rows.forEach((r,i)=>{
    const v=+(r.n??r.amt??0);
    const h=Math.max(2,v/max*inner);
    const x=12+i*step+(step-bw)/2,y=H-padB-h;
    s+=`<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${bw.toFixed(1)}" rx="4" height="${h.toFixed(1)}" fill="${opt.color||'var(--primary)'}" opacity="0.92"/>`+
       `<text x="${(x+bw/2).toFixed(1)}" y="${(y-6).toFixed(1)}" text-anchor="middle" font-size="10" font-weight="700" fill="${opt.tc||'var(--text-soft)'}">${opt.fmt?opt.fmt(v):v}</text>`+
       `<text x="${(x+bw/2).toFixed(1)}" y="${H-10}" text-anchor="middle" font-size="9.5" fill="var(--text-mute)">${opt.ml?opt.ml(r):mLabel(r.m)}</text>`;
  });
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;display:block">${s}</svg>`;
}
function hbarChart(rows,opt){
  opt=opt||{};
  if(!rows.length)return '<div class="empty">No data yet.</div>';
  const max=Math.max(...rows.map(r=>+(r.n??0)),1);
  return `<div style="display:flex;flex-direction:column;gap:11px">`+rows.map(r=>{
    const pct=Math.max(2,Math.round((+(r.n??0))/max*100));
    return `<div><div style="display:flex;justify-content:space-between;align-items:baseline;font-size:12px;margin-bottom:4px"><span style="color:var(--text-soft);font-weight:600">${esc(r.m??r.plan??r.status??r.role??'—')}</span><span style="color:var(--text);font-weight:800">${r.n}</span></div><div style="height:9px;background:var(--bg-alt);border:1px solid var(--border);border-radius:99px;overflow:hidden"><div style="width:${pct}%;height:100%;border-radius:99px;background:${opt.color||'var(--primary)'}"></div></div></div>`;
  }).join('')+`</div>`;
}
function donutChart(rows){
  const total=rows.reduce((s,r)=>s+(+(r.n??0)),0);
  if(!total)return '<div class="empty">No tickets yet.</div>';

/* ── Table toolkit (v3.64): client-side search + filters + sort + pagination for every table view ── */
let TBLK = {}; // per-view state: {q, f:{col:val}, p, ps, s, dir}
let TBLREG = {}; // per-view cfg registry for re-render after filter change
function tblState(k){ return TBLK[k] || (TBLK[k] = {q:'', f:{}, p:1, ps:10, s:'', dir:1}); }
function tblUniq(data, col){ return [...new Set((data||[]).map(r=>r[col]).filter(v=>v!==null&&v!==undefined&&v!==''))].sort(); }
function tblApply(k, data, cfg){
  const st = tblState(k);
  let rows = (data||[]).slice();
  const q = st.q.trim().toLowerCase();
  if(q && cfg.search) rows = rows.filter(r=>cfg.search.some(f=>String(r[f]??'').toLowerCase().includes(q)));
  for(const col in st.f){ const v = st.f[col]; if(v) rows = rows.filter(r=>String(r[col]??'')===String(v)); }
  if(st.s && cfg.sortable && cfg.sortable.includes(st.s)){
    const col = st.s, dir = st.dir;
    rows.sort((a,b)=>{ const x=a[col], y=b[col]; if(typeof x==='number'&&typeof y==='number') return (x-y)*dir; return String(x??'').localeCompare(String(y??''))*dir; });
  }
  const total = rows.length;
  const pages = Math.max(1, Math.ceil(total/st.ps));
  if(st.p > pages) st.p = pages;
  const from = (st.p-1)*st.ps;
  return { rows: rows.slice(from, from+st.ps), total, pages, from: total?from+1:0, to: Math.min(total, from+st.ps) };
}
function tblBar(k, cfg){
  const st = tblState(k);
  const nF = Object.keys(st.f).filter(c=>st.f[c]).length;
  const fsel = (cfg.filters||[]).map(f=>{
    const col=f[0], label=f[1], cur=st.f[col]||'';
    const src = (f[2]||tblUniq(cfg.data,col)).map(v=>typeof v==='object'?v:{v:String(v),l:String(v)});
    return `<select data-col="${col}" onchange="tblSetF('${k}','${col}',this.value)"><option value="">${label}: all</option>${src.map(o=>`<option value="${esc(o.v)}" ${cur===String(o.v)?'selected':''}>${esc(o.l)}</option>`).join('')}</select>`;
  }).join('');
  return `<div class="tbl-bar" id="tblBar-${k}">
    <input class="tbl-q" id="tblQ-${k}" placeholder="🔍 ${cfg.ph||'Search…'}" value="${esc(st.q)}" oninput="tblSetQ('${k}',this.value)">
    ${fsel}
    ${nF?`<button class="btn-ghost" onclick="tblClear('${k}')">✕ Clear (${nF})</button>`:''}
    <span class="tbl-count" id="tblCount-${k}"></span>
  </div>`;
}
function tblTh(k,label,col,st){
  if(!col) return `<th>${label}</th>`;
  const on = st.s===col;
  return `<th class="tbl-s${on?' on':''}" onclick="tblSort('${k}','${col}')" title="Sort by ${label}">${label} ${on?(st.dir===1?'▲':'▼'):'⇅'}</th>`;
}
function tblPager(k, meta){
  if(meta.pages<=1) return '';
  const st = tblState(k);
  const pg = [];
  for(let i=1;i<=meta.pages;i++){ if(i===1||i===meta.pages||Math.abs(i-st.p)<=2) pg.push(i); else if(pg[pg.length-1]!=='…') pg.push('…'); }
  return `<div class="tbl-pager">
    <span class="c-sub">${meta.from}–${meta.to} of ${meta.total}</span>
    <button class="tbl-pg" onclick="tblGo('${k}',${st.p-1})" ${st.p<=1?'disabled':''}>‹</button>
    ${pg.map(p=>p==='…'?`<span class="tbl-dot">…</span>`:`<button class="tbl-pg ${p===st.p?'on':''}" onclick="tblGo('${k}',${p})">${p}</button>`).join('')}
    <button class="tbl-pg" onclick="tblGo('${k}',${st.p+1})" ${st.p>=meta.pages?'disabled':''}>›</button>
    <select class="tbl-ps" onchange="tblSetPs('${k}',this.value)">${[10,25,50,100].map(n=>`<option value="${n}" ${st.ps===n?'selected':''}>${n}/pg</option>`).join('')}</select>
  </div>`;
}
function tblPanel(k, cfg){
  return `<div class="panel">${tblBar(k,cfg)}<div class="tbl-wrap"><table><thead id="tblHead-${k}"></thead><tbody id="tblBody-${k}"></tbody></table></div><div id="tblPager-${k}"></div></div>`;
}
function tblDraw(k, cfg){
  const st = tblState(k), meta = tblApply(k, cfg.data, cfg);
  const h = $('tblHead-'+k); if(h) h.innerHTML = cfg.head(st);
  const b = $('tblBody-'+k); if(b) b.innerHTML = meta.rows.map(cfg.row).join('') || cfg.empty;
  const p = $('tblPager-'+k); if(p) p.innerHTML = tblPager(k, meta);
  const c = $('tblCount-'+k); if(c) c.textContent = meta.total+' row'+(meta.total===1?'':'s');
}
function tblSetQ(k,v){ tblState(k).q=v; tblState(k).p=1; const c=TBLREG[k]; if(c) tblDraw(k,c); }
function tblSetF(k,col,v){
  const st=tblState(k);
  if(v) st.f[col]=String(v); else delete st.f[col];
  st.p=1;
  const c=TBLREG[k]; if(!c) return;
  const bar=$('tblBar-'+k); if(bar) bar.outerHTML = tblBar(k,c);
  tblDraw(k,c);
}
function tblClear(k){
  delete TBLK[k];
  const q=$('tblQ-'+k); if(q) q.value='';
  const c=TBLREG[k]; if(!c) return;
  const bar=$('tblBar-'+k); if(bar) bar.outerHTML = tblBar(k,c);
  tblDraw(k,c);
}
function tblGo(k,p){ const st=tblState(k); st.p=p; const c=TBLREG[k]; if(c) tblDraw(k,c); }
function tblSetPs(k,v){ const st=tblState(k); st.ps=+v; st.p=1; const c=TBLREG[k]; if(c) tblDraw(k,c); }
function tblSort(k,col){ const st=tblState(k); if(st.s===col) st.dir*=-1; else { st.s=col; st.dir=1; } st.p=1; const c=TBLREG[k]; if(c) tblDraw(k,c); }
function tblReg(k,cfg){ TBLREG[k]=cfg; }

function cmsRenderJump(p){

  el.innerHTML=`<span style="font-size:10.5px;font-weight:800;letter-spacing:1px;color:var(--text-mute);text-transform:uppercase;padding-top:4px">Sections</span>`+
    secs.map(s=>{const n=blocks.filter(b=>b.section===s).length;const hid=CMS.vis[p+'.'+s]===0;
      return `<button class="chip" style="${hid?'opacity:.55':''}" onclick="cmsSecJump('${p}','${esc(s)}')" data-tip="${hid?'Section hidden on the site':CMS_SEC_LABEL[s]||s}" data-tip-pos="top">${esc(CMS_SEC_LABEL[s]||s)} · ${n}${hid?' 🙈':''}</button>`;}).join('');
}

          <button class="btn-ghost" style="font-size:11px;color:var(--danger)" onclick="event.stopPropagation();cmsResetSection('${p}','${esc(sec)}')" data-tip="Reset only this section to defaults" data-tip-pos="left">↺</button>

function cmsFieldHtml(b){

    inp=`<textarea data-cms="${esc(tag)}" oninput="cmsCount(this);cmsMarkDirty('${esc(tag)}')" style="${dirty?'border-color:#E67E22':''}">${esc(b.v)}</textarea>`;

  }else if(ft==='url'){

  }else if(ft==='num'){
    inp=`<div style="display:flex;gap:6px"><input data-cms="${esc(tag)}" type="number" value="${esc(b.v)}" oninput="cmsCount(this);cmsMarkDirty('${esc(tag)}')" style="flex:1">${isImg?`<button class="btn-ghost" onclick="cmsMediaDrawer('${esc(tag)}')" data-tip="Pick or upload an image" data-tip-pos="left" title="Media">🖼</button>`:''}</div>`;
  }else{

    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:5px">
      <label class="lb" style="margin:0;text-transform:capitalize" ${hint?`data-tip="${esc(hint)}" data-tip-pos="right"`:''}>${dirty?'<span style="color:#E67E22;margin-right:4px">●</span>':''}${esc(lbl)}${isBn?'<span class="badge b-purple" style="margin-left:6px">বাংলা</span>':''}${def?'':'<span class="badge b-purple" style="margin-left:6px">custom</span>'}</label>
      ${def?'':`<button class="btn-ghost" style="color:var(--danger);padding:2px 6px;font-size:11px" onclick="cmsDelBlock('${esc(b.page)}','${esc(b.section)}','${esc(b.k)}')" data-tip="Remove this custom field" data-tip-pos="left" title="Remove block">✕</button>`}
    </div>
    ${inp}
    <div class="c-sub" style="font-size:10.5px;text-align:right;margin-top:3px"><span class="cms-cnt">${esc(b.v).length}</span> chars</div>

function cmsColorSync(tag,v){const el=document.querySelector('[data-cms="'+tag+'"]');if(el)el.value=v;cmsMarkDirty(tag);}
function cmsMarkDirty(tag){

function cmsRenderDirty(){

function cmsCount(el){const c=el.closest('.cms-field')?el.closest('.cms-field').querySelector('.cms-cnt'):null;if(c)c.textContent=el.value.length;}
function cmsSyncDom(){

  document.querySelectorAll('#cmsPanels [data-cms]').forEach(el=>{
    const tag=el.getAttribute('data-cms').split('|');
    if(tag.length!==3)return;
    const b=CMS.blocks.find(x=>x.page===tag[0]&&x.section===tag[1]&&x.k===tag[2]);
    if(b)b.v=el.value;
  });
}
function cmsTab(p){cmsSyncDom();CMS.tab=p;cmsRenderJump(p);cmsRenderPanels();cmsRenderDirty();}

function cmsPageSelChange(p){cmsClearFilter();cmsTab(p);}

function cmsFilterTypeOf(k){const ft=cmsFieldType(k);return ft==='text'?(cmsIsLong(k)?'long':'text'):ft;}

function cmsFilterControls(){

function cmsFilterSecs(){

function cmsFilterApply(){

  const pgel=$('cmsFpage');if(pgel)CMS.flt.page=pgel.value;
  const sel=$('cmsFsec');if(sel)CMS.flt.sec=sel.value;
  const tel=$('cmsFtype');if(tel)CMS.flt.type=tel.value;
  const stel=$('cmsFstatus');if(stel)CMS.flt.status=stel.value;
  const lel=$('cmsFlang');if(lel)CMS.flt.lang=lel.value;
  const q=CMS.flt.q.trim().toLowerCase();
  const active=cmsFilterActive();
  const jump=$('cmsJump');if(jump)jump.style.display=active?'none':'flex';
  const chip=$('cmsFltChip');
  if(chip)chip.innerHTML=active?`<span class="chip on" style="cursor:pointer" onclick="cmsClearFilter()">⚙️ ${CMS.fltN} matched — ✕</span>`:'';
  const btn=$('cmsFltBtn');if(btn)btn.classList.toggle('on',active);
  if(!active){cmsRenderJump(CMS.tab);cmsRenderPanels();cmsRenderDirty();return;}
  let matches=CMS.blocks.filter(b=>{
    if(CMS.flt.page&&b.page!==CMS.flt.page)return false;
    if(CMS.flt.sec&&b.section!==CMS.flt.sec)return false;
    if(CMS.flt.lang==='en'&&b.k.endsWith('_bn'))return false;
    if(CMS.flt.lang==='bn'&&!b.k.endsWith('_bn'))return false;
    if(CMS.flt.type&&cmsFilterTypeOf(b.k)!==CMS.flt.type)return false;
    if(CMS.flt.status==='custom'&&CMS.defKeys.has(b.page+'|'+b.section+'|'+b.k))return false;
    if(CMS.flt.status==='default'&&!CMS.defKeys.has(b.page+'|'+b.section+'|'+b.k))return false;
    if(q){const hay=(b.page+' '+(CMS_PAGES[b.page]?CMS_PAGES[b.page].l:'')+' '+b.section+' '+b.k+' '+(b.v||'')).toLowerCase();if(!hay.includes(q))return false;}
    return true;
  });
  CMS.fltN=matches.length;
  if(chip)chip.innerHTML=`<span class="chip on" style="cursor:pointer" onclick="cmsClearFilter()">⚙️ ${CMS.fltN} matched — ✕</span>`;
  const byPage={};matches.forEach(b=>{(byPage[b.page]=byPage[b.page]||[]).push(b)});
  const order=Object.keys(CMS_PAGES);
  const pages=Object.keys(byPage).sort((a,b)=>(order.indexOf(a)<0?99:order.indexOf(a))-(order.indexOf(b)<0?99:order.indexOf(b)));
  const el=$('cmsPanels');if(!el)return;
  if(!pages.length){el.innerHTML=`<div class="empty">No fields match your filters — try widening them.</div>`;cmsRenderDirty();return;}
  let html=`<div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:12px">
    <span class="c-sub">${matches.length} match${matches.length===1?'':'es'} across ${pages.length} page${pages.length===1?'':'s'} — edit inline, then hit 💾 Save all</span>
    <button class="btn-outline" onclick="cmsClearFilter()">✕ Clear filters</button></div>`;
  pages.forEach(p=>{

/* ── Theming v2 (SA1-fullsite v12, v3.66): brand colors → panel CSS vars ── */
async function applyAdminTheme(){
  try{
    const d=await fetch(API+'app-theme').then(r=>r.json());
    if(!d.ok||!d.theme)return;
    const t=d.theme, primary=t.primary||'#2F80ED', secondary=t.secondary||'#1E5EB8', accent=t.accent||'#27AE60';
    const r=document.documentElement.style;
    r.setProperty('--primary',primary);
    r.setProperty('--primary-dark',darkenHex(primary,.35));
    r.setProperty('--primary-light',lightenHex(primary,.87));
    r.setProperty('--secondary',secondary);
    r.setProperty('--accent',accent);
    r.setProperty('--grad',`linear-gradient(135deg,${primary} 0%,${secondary} 100%)`);
    const sh=rgbaHex(primary,.30);
    if(sh)r.setProperty('--shadow',`0 8px 22px ${sh}`);
  }catch(e){}
}
function rgbaHex(hex,a){
  const m=/^#?([0-9a-f]{6})$/i.exec((hex||'').trim());if(!m)return null;
  const n=parseInt(m[1],16);
  return `rgba(${(n>>16)&255},${(n>>8)&255},${n&255},${a})`;
}
function darkenHex(hex,amt){
  const m=/^#?([0-9a-f]{6})$/i.exec((hex||'').trim());if(!m)return hex;
  const n=parseInt(m[1],16),f=v=>Math.max(0,Math.min(255,Math.round(v*(1-amt))));
  return '#'+[f((n>>16)&255),f((n>>8)&255),f(n&255)].map(v=>v.toString(16).padStart(2,'0')).join('');
}
function lightenHex(hex,amt){
  const m=/^#?([0-9a-f]{6})$/i.exec((hex||'').trim());if(!m)return hex;
  const n=parseInt(m[1],16),f=v=>Math.max(0,Math.min(255,Math.round(v+(255-v)*amt)));
  return '#'+[f((n>>16)&255),f((n>>8)&255),f(n&255)].map(v=>v.toString(16).padStart(2,'0')).join('');
}

async function apiConsoleRun(){
  const action=$('apc_action').value.trim();if(!action){toast('Enter an endpoint action','error');return}
  const method=$('apc_method').value;
  const useAuth=$('apc_auth').value==='session';
  let body=null;
  try{body=JSON.parse($('apc_body').value||'{}')}catch(e){toast('Body is not valid JSON','error');return}
  apiHistPush(action,method,$('apc_body').value);
  const t0=performance.now();
  const url=API+(method==='GET'?'':action);
  const opts={method,headers:{}};
  if(method!=='GET'&&method!=='DELETE')opts.headers['Content-Type']='application/json';
  if(useAuth&&TOKEN)opts.headers['Authorization']='Bearer '+TOKEN;
  if(method!=='GET')opts.body=JSON.stringify(body);
  try{
    const res=await fetch(url,opts);
    const ms=Math.round(performance.now()-t0);
    const txt=await res.text();
    let pretty=txt;try{pretty=JSON.stringify(JSON.parse(txt),null,2)}catch(e){}
    $('apc_out').innerHTML=`<div style="display:flex;align-items:center;gap:8px;margin-bottom:10px;flex-wrap:wrap">
      <span class="badge ${res.ok?'b-green':'b-red'}">HTTP ${res.status}</span><span class="c-sub">${ms} ms</span>
      <button class="btn-ghost" style="font-size:11px;margin-left:auto" onclick="apiCopyOut()">⧉ Copy</button></div>
      <pre style="max-height:420px;overflow:auto;font-size:11.5px;line-height:1.5;white-space:pre-wrap;word-break:break-word">${esc(pretty)}</pre>`;
  }catch(e){

  }
}

  if(!id){toast('Tenant API key created','ok');tenantKeyShow(d.key,'key');}
  else toast('Tenant API key updated','ok');
  renderApiTenantKeys();
}
function tenantKeyShow(full,kind){
  openDrawer('🔑 Tenant API key — copy it now',
    `<p style="font-size:13px;margin:0 0 10px;color:var(--text-soft)">${kind==='key'?'This key is shown only once. Send it to the subscriber\'s backend and store it securely — it authenticates them via the <code>X-API-Key</code> header.':'The previous key was immediately invalidated. Store the new one securely.'}</p>
     <div style="display:flex;gap:8px"><input id="tk_full" value="${esc(full)}" readonly style="font-family:monospace;flex:1"><button class="btn-outline" onclick="tkCopy()">📋 Copy</button></div>`,
    `<div class="dr-actions"><button class="btn-primary" onclick="closeDrawer()">Done</button></div>`);
}
function tkCopy(){const el=$('tk_full');el.select();try{document.execCommand('copy')}catch(e){}toast('Key copied','ok');}
async function tenantKeyRotate(id){
  if(!confirm('Rotate this tenant API key? The current key stops working immediately.'))return;
  const d=await admin({action:'tenant-key-rotate',id});
  if(!d.ok)return toast(d.error||'Failed','error');

}
async function tenantKeyToggle(id){
  const d=await admin({action:'tenant-key-toggle',id});
  if(d.ok){toast(d.active?'Tenant key enabled':'Tenant key disabled','ok');renderApiTenantKeys();}else toast(d.error||'Failed','error');

async function tenantKeyDelete(id){
  if(!confirm('Revoke this tenant API key? The subscriber immediately loses API access (401).'))return;
  const d=await admin({action:'tenant-key-delete',id});
  if(d.ok){toast('Tenant API key revoked','ok');renderApiTenantKeys();}else toast(d.error||'Failed','error');

async function renderApiUsage(){
  load('apiUsageBody','<div class="empty">Loading…</div>');
  const d=await admin({action:'api-usage'});
  if(!d.ok){load('apiUsageBody',`<div class="empty">${esc(d.error||'Failed')}</div>`);return}
  const u=d.usage||{};
  const h24=u.h24||[];
  const top=h24.slice(0,10);
  const max=Math.max(1,...top.map(r=>+(r.n||0)));
  const errRate=u.d24_total?Math.round((u.d24_errors||0)/u.d24_total*100):0;
  const recent=u.recent||[];
  const cfg={
    data:recent, ph:'Search action…',
    search:['action'],
    filters:[['auth','Auth'],['method','Method']],
    sortable:['ts','action','ms'],
    head:st=>`<tr>${tblTh('apius','When','ts',st)}${tblTh('apius','Action','action',st)}<th>Method</th><th>Auth</th><th>Status</th>${tblTh('apius','ms','ms',st)}</tr>`,
    row:r=>`<tr><td class="c-sub">${esc((r.ts||'').slice(11,19))}</td><td><code style="font-size:12px;color:var(--primary)">${esc(r.action)}</code></td><td>${r.method==='GET'?badge('GET'):badge('POST')}</td><td>${badge(r.auth)}</td><td>${r.status<400?badge('OK'):badge(r.status)}</td><td class="c-sub">${r.ms}ms</td></tr>`,
    empty:'<tr><td colspan="6"><div class="empty">No requests yet.</div></td></tr>'
  };
  tblReg('apius',cfg);
  load('apiUsageBody',
    `<div class="stats">${[['📈','Calls (24h)',u.d24_total??0,'tracked via api_usage'],['🗓️','Calls (7d)',u.d7_total??0,'rolling window'],['⚠️','Errors (24h)',u.d24_errors??0,errRate+'% error rate'],['⚡','Avg top-10 latency',(top.length?Math.round(top.reduce((s,r)=>s+(+(r.avg_ms||0)),0)/top.length):0)+' ms','fastest endpoints first']].map(c=>`<div class="stat"><div class="s-label"><span class="s-ico">${c[0]}</span>${c[1]}</div><div class="s-value">${c[2]}</div><div class="s-trend">${c[3]}</div></div>`).join('')}</div>
    <div class="grid-2" style="gap:18px">
      <div class="panel"><div class="panel-h"><span class="t"><span class="pi">🔥</span>Top endpoints (24h)</span></div><div class="panel-b">${top.length?top.map(r=>{const pct=Math.max(3,Math.round((+(r.n||0))/max*100));
        return `<div style="margin-bottom:10px"><div style="display:flex;justify-content:space-between;align-items:baseline;font-size:12px;margin-bottom:4px"><code style="color:var(--primary);font-weight:700">${esc(r.action)}</code><span style="font-size:11px;color:var(--text-mute)">${r.n} calls${r.errs?' · '+r.errs+' errs':''} · ${r.avg_ms}ms</span></div><div style="height:8px;background:var(--bg-alt);border:1px solid var(--border);border-radius:99px;overflow:hidden"><div style="width:${pct}%;height:100%;border-radius:99px;background:${(r.errs||0)>0?'#E74C3C':'var(--primary)'}"></div></div></div>`;}).join(''):'<div class="empty">No API calls in the last 24h yet.</div>'}</div></div>
      <div class="panel"><div class="panel-h"><span class="t"><span class="pi">🔐</span>Auth mix (24h)</span></div><div class="panel-b">${(u.by_auth||[]).length?(u.by_auth||[]).map(a=>`<div class="kv"><span class="k">${esc(a.auth)}</span><span class="v">${a.n}</span></div>`).join(''):'<div class="empty">No data yet.</div>'}</div></div>
    </div>
    <div class="panel"><div class="panel-h"><span class="t"><span class="pi">🕒</span>Recent requests</span><button class="btn-outline" style="margin-left:auto" onclick="renderApiUsage()">🔄 Refresh</button></div></div>`+tblPanel('apius',cfg));
  tblDraw('apius',cfg);
}
function apiSchemaExport(){
  const schema={openapi:'3.0.3',info:{title:'KRTaker API',version:'v1',description:'KRTaker platform API — web & mobile data management'},paths:{}};
  API_CATALOG.forEach(e=>{
    const p='/api/'+e[0].replace(/ /g,'?action=');
    schema.paths[p]=schema.paths[p]||{};
    schema.paths[p][e[1].toLowerCase()]={summary:e[4],tags:[e[3]],security:e[2]==='public'?[]:[{bearerAuth:[]}],responses:{200:{description:'OK'}}};
  });
  schema.components={securitySchemes:{bearerAuth:{type:'http',scheme:'bearer'}}};
  const blob=new Blob([JSON.stringify(schema,null,2)],{type:'application/json'});
  const u=URL.createObjectURL(blob);
  const a=document.createElement('a');a.href=u;a.download='krtaker-api-schema.json';a.click();
  URL.revokeObjectURL(u);
  toast('API schema (OpenAPI) downloaded','ok');
}
function apiEndpointDetail(i){
  const e=API_CATALOG[i];
  if(!e)return;
  openDrawer('📚 '+esc(e[0]),
    `<div style="display:flex;flex-direction:column;gap:12px">
      <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap"><span class="badge" style="background:${apiMethodColor(e[1])};color:#fff">${e[1]}</span><code style="font-size:13px;color:var(--primary);font-weight:800">/api/${esc(e[0])}</code><span class="badge ${e[2]==='public'?'b-green':e[2]==='session'?'b-blue':'b-purple'}">${e[2]}</span></div>
      <div style="font-size:13px;color:var(--text-soft);line-height:1.6">${esc(e[4])}</div>
      <div class="panel"><div class="panel-h"><span class="t"><span class="pi">📝</span>How to call it</span></div><div class="panel-b" style="font-size:12px;line-height:1.8">
        <div><b>URL:</b> <code>POST https://krtaker.com/api/app-admin</code> (or GET <code>/api/${esc(e[0])}</code> for public reads)</div>
        <div><b>Auth:</b> ${e[2]==='public'?'none — public endpoint':e[2]==='session'?'<code>Authorization: Bearer &lt;token&gt;</code> from app-login':'<code>Authorization: Bearer &lt;super-admin token&gt;</code>'}</div>
        ${e[0].includes('app-admin')?`<div><b>Body:</b> <code>{"action":"${esc(e[0].split(' ')[1]||'overview')}"}</code> + sub-action params</div>`:''}
      </div></div>
      <button class="btn-primary" onclick="apiTestFill('${esc(e[0])}','${e[1]}');closeDrawer()">🧪 Try in console</button>
    </div>`,
    `<div class="dr-actions"><button class="btn-ghost" onclick="closeDrawer()">Close</button></div>`);
}
async function renderApiData(){
  load('apiDataBody','<div class="empty">Loading…</div>');
  const d=await admin({action:'api-stats'});
  if(!d.ok){load('apiDataBody',`<div class="empty">${esc(d.error||'Failed')}</div>`);return}
  const t=d.tables||{};
  const order=['subscribers','app_users','properties','units','tenants','leases','invoices','payments','receipts','tickets','platform_tickets','notices','partners','leads','plan_catalog','cms_content','cms_history','integrations','audit_log','auth_attempts','app_tokens','newsletter_emails','onboarding_apps','referrals'];
  const cards=order.map(tb=>`<button class="stat" style="cursor:pointer;text-align:left" onclick="apiTableDrawer('${tb}')">
    <div class="s-label"><span class="s-ico">🗄️</span>${esc(tb)}</div><div class="s-value">${(t[tb]??'-')}</div><div class="s-trend">rows · click to view</div></button>`).join('');
  load('apiDataBody',
    `<div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px">
      <span class="c-sub">Web and mobile data tables · <b>${(d.total_rows??0).toLocaleString()}</b> total rows</span>
      <span class="badge b-blue">${d.meta_keys} config keys</span>
      <span class="badge b-gray">db ${((d.db_size||0)/1048576).toFixed(1)} MB</span>
      <button class="btn-outline" style="margin-left:auto" onclick="renderApiData()">🔄 Refresh</button></div>
    <div class="stats" style="grid-template-columns:repeat(auto-fill,minmax(150px,1fr))">${cards}</div>`);
}
async function apiTableDrawer(tb){
  openDrawer('🗄️ '+esc(tb)+' — recent rows','<div class="empty">Loading…</div>',`<div class="dr-actions"><button class="btn-ghost" onclick="closeDrawer()">Close</button></div>`);
  const d=await admin({action:'api-table',table:tb});
  if(!d.ok){$('drawerBody').innerHTML=`<div class="empty">${esc(d.error||'Failed')}</div>`;return}
  const cols=d.columns||[],rows=d.rows||[];
  if(!rows.length){$('drawerBody').innerHTML='<div class="empty">No rows in this table.</div>';return}
  const cfg={
    data:rows, ph:'Search any column…',
    search:cols,
    filters:[],
    sortable:cols,
    head:st=>`<tr>${cols.map(c=>tblTh('aptb',c,c,st)).join('')}</tr>`,
    row:r=>`<tr>${cols.map(c=>{const v=r[c];return `<td style="max-width:220px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(typeof v==='string'&&v.length>60?v.slice(0,60)+'…':v)}</td>`}).join('')}</tr>`,
    empty:'<tr><td colspan="'+cols.length+'"><div class="empty">No rows.</div></td></tr>'
  };
  tblReg('aptb',cfg);
  $('drawerBody').innerHTML=tblPanel('aptb',cfg);
  tblDraw('aptb',cfg);
}
function renderApi(){
  pageHead('API Library — manage how the web and mobile apps use the platform API',`<button class="btn-outline" onclick="apiSchemaExport()" data-tip="Download the endpoint catalog as OpenAPI JSON for client developers" data-tip-pos="left">📦 Export schema</button>`);
  load('pageBody',
    `<div style="display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-bottom:16px">
      <button class="chip ${API_TAB==='endpoints'?'on':''}" onclick="apiTab('endpoints')">📚 Endpoints</button>
      <button class="chip ${API_TAB==='console'?'on':''}" onclick="apiTab('console')">🧪 Console</button>
      <button class="chip ${API_TAB==='usage'?'on':''}" onclick="apiTab('usage')">📈 Usage</button>
      <button class="chip ${API_TAB==='keys'?'on':''}" onclick="apiTab('keys')">🔑 Web and Mobile Keys</button>
      <button class="chip ${API_TAB==='tkeys'?'on':''}" onclick="apiTab('tkeys')">🏢 Tenant Keys</button>
      <button class="chip ${API_TAB==='data'?'on':''}" onclick="apiTab('data')">🗄️ Data</button>
    </div>
    <div id="apiBody"></div>`);
  if(API_TAB==='endpoints'){
    load('apiBody',
      `<div style="display:flex;gap:8px;align-items:center;margin-bottom:14px;flex-wrap:wrap">
        <input id="apiSearch" placeholder="🔍 Search endpoints…" style="max-width:260px" oninput="apiCatSearch()">
        <span class="c-sub">${API_CATALOG.length} endpoints · public / session / admin</span>
        <span style="margin-left:auto" class="c-sub">Try: <code>cms-read</code>, <code>plans</code>, <code>app-admin api-stats</code></span>
      </div><div id="apiCatBody"></div>`);
    API_CAT=API_CATALOG.slice();apiCatSearch();
  }else if(API_TAB==='console'){
    load('apiBody',
      `<div class="panel"><div class="panel-h"><span class="t"><span class="pi">🧪</span>Endpoint test console</span><button class="btn-outline" style="margin-left:auto" onclick="apiHistDrawer()">🕒 History</button></div><div class="panel-b">
        <div class="frm">
          <div class="grid-2"><div><label class="lb">Endpoint action</label><input id="apc_action" list="apc_list" placeholder="e.g. app-admin" onkeydown="if(event.key==='Enter')apiConsoleRun()"><datalist id="apc_list">${API_CATALOG.map(e=>`<option value="${esc(e[0])}">${e[3]}</option>`).join('')}</datalist></div>
          <div><label class="lb">Method</label><select id="apc_method"><option>POST</option><option>GET</option></select></div></div>
          <div class="grid-2"><div><label class="lb">Auth</label><select id="apc_auth"><option value="session">🔑 Session token (Bearer)</option><option value="none">🌐 None</option></select></div>
          <div style="align-self:flex-end"><button class="btn-primary" onclick="apiConsoleRun()">▶ Send request</button></div></div>
          <div><label class="lb">JSON body (POST)</label><textarea id="apc_body" style="min-height:110px;font-family:monospace;font-size:12px" placeholder='{"action":"overview"}'>{"action":"overview"}</textarea></div>
        </div>
        <div id="apc_out" style="margin-top:12px;border:1px solid var(--border);border-radius:10px;padding:12px"><div class="empty">Run a request to see the JSON response.</div></div>
      </div></div>`);
  }else if(API_TAB==='keys'){
    load('apiBody','<div id="apiKeysBody"></div>');renderApiKeys();
  }else if(API_TAB==='tkeys'){
    renderApiTenantKeys();
  }else if(API_TAB==='usage'){
    load('apiBody','<div id="apiUsageBody"></div>');renderApiUsage();
  }else{
    load('apiBody','<div id="apiDataBody"></div>');renderApiData();
  }
}
/* ── Advanced CMS v2 (SA1-fullsite): visibility toggles, section reset, media drawer ── */
async function cmsVisToggle(p, sec) {
  const cur = CMS.vis[p + '.' + sec] === 0 ? 1 : 0;
  const d = await admin({ action: 'cms-vis-save', page: p, section: sec, visible: cur });
  if (d.ok) { CMS.vis[p + '.' + sec] = cur; toast(cur ? 'Section shown' : 'Section hidden', 'ok'); renderCms(); }
  else toast(d.error || 'Failed', 'error');
}
async function cmsResetSection(p, sec) {
  if (!confirm('Reset the "' + sec + '" section of ' + (CMS_PAGES[p]?.l || p) + ' to defaults? (kept in history)')) return;
  const d = await admin({ action: 'cms-reset-section', page: p, section: sec });
  if (d.ok) { toast('Section reset (' + d.archived + ' values archived)', 'ok'); renderCms(); }
  else toast(d.error || 'Failed', 'error');
}
let CMS_MEDIA_INSERT = null;
function cmsMediaDrawer(insertTag) {
  CMS_MEDIA_INSERT = insertTag || null;
  openDrawer('🖼 Media library',
    '<div class="empty">Loading…</div>' +
    '<div style="margin-top:10px;border-top:1px solid var(--border);padding-top:12px">' +
      '<label class="lb">Upload new image (jpg/png/webp/gif/svg, max 5 MB)</label>' +
      '<input type="file" id="cmsMediaFile" accept="image/*" style="margin:6px 0">' +
      '<button class="btn-primary" onclick="cmsMediaUpload()">⬆ Upload</button>' +
      '<div class="c-sub" style="font-size:11px;margin-top:6px">' + (insertTag ? 'Pick a file to insert it into the selected image field.' : 'Pick a file to copy its URL.') + '</div>' +
    '</div>',
    '<div class="dr-actions"><button class="btn-ghost" onclick="closeDrawer()">Close</button></div>');
  cmsMediaList();
}
async function cmsMediaList() {
  const d = await admin({ action: 'cms-media-list' });
  if (!d.ok) { const b = $('drawerBody'); if (b) b.innerHTML = '<div class="empty">' + esc(d.error || 'Failed') + '</div>'; return; }
  const files = d.files || [];
  const b = $('drawerBody');
  if (!b) return;
  b.innerHTML = (files.length
    ? `<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px">` + files.map(f =>
        `<div style="border:1px solid var(--border);border-radius:10px;overflow:hidden;cursor:pointer" onclick="cmsMediaPick('${esc(f.url)}')" data-tip="Click to ${CMS_MEDIA_INSERT ? 'insert' : 'copy URL'}" data-tip-pos="top">` +
          `<img src="${esc(f.url)}" style="width:100%;height:80px;object-fit:cover;display:block" loading="lazy" onerror="this.style.display='none'">` +
          `<div style="padding:6px 8px;font-size:10.5px;color:var(--text-mute);word-break:break-all">${esc(f.name)}</div>` +
        `</div>`).join('') + `</div>`
    : '<div class="empty">No uploaded images yet — upload one below.</div>') +
    '<div style="margin-top:14px;border-top:1px solid var(--border);padding-top:12px">' +
      '<label class="lb">Upload new image (jpg/png/webp/gif/svg, max 5 MB)</label>' +
      '<input type="file" id="cmsMediaFile" accept="image/*" style="margin:6px 0">' +
      '<button class="btn-primary" onclick="cmsMediaUpload()">⬆ Upload</button>' +
      '<div class="c-sub" style="font-size:11px;margin-top:6px">' + (CMS_MEDIA_INSERT ? 'Pick a file to insert it into the selected image field.' : 'Pick a file to copy its URL.') + '</div>' +
    '</div>';
}
async function cmsMediaUpload() {
  const inp = $('cmsMediaFile');
  if (!inp || !inp.files || !inp.files[0]) { toast('Choose a file first', 'error'); return; }
  const fd = new FormData();
  fd.append('file', inp.files[0]);
  const res = await fetch(API + 'app-admin', { method: 'POST', headers: { 'Authorization': 'Bearer ' + TOKEN }, body: fd });
  const d = await res.json().catch(() => ({ ok: false, error: 'Parse error' }));
  if (d.ok) { toast('Uploaded ' + d.name, 'ok'); cmsMediaList(); }
  else toast(d.error || 'Failed', 'error');
}
function cmsMediaPick(url) {
  if (CMS_MEDIA_INSERT) {
    const el = document.querySelector('[data-cms="' + CSS.escape(CMS_MEDIA_INSERT) + '"]');
    if (el) { el.value = url; el.dispatchEvent(new Event('input')); }
    toast('Image URL inserted — press Save all to publish', 'ok');
    CMS_MEDIA_INSERT = null;
    closeDrawer();
  } else {
    navigator.clipboard.writeText(location.origin + url).then(() => toast('URL copied', 'ok')).catch(() => toast(url, 'info'));
  }
}
