    /* ═══ COMPACT DENSITY MODE ═══ */
    .compact-mode .table-wrap td,.compact-mode .table-wrap th{padding:2px 6px!important;font-size:10.5px}
    .compact-mode .stat-card{padding:6px 10px}
    .compact-mode .card-body{padding:4px 8px}
    .compact-mode .kanban-card{padding:4px 6px}
    /* ═══ TOP-BAR THEME PALETTE ═══ */
    .tp-dot{width:26px;height:26px;border-radius:50%;cursor:pointer;border:2px solid rgba(0,0,0,.12);display:flex;align-items:center;justify-content:center;transition:transform .12s,box-shadow .12s;flex-shrink:0}
    .tp-dot:hover{transform:scale(1.15);box-shadow:0 2px 8px rgba(0,0,0,.25)}
    .tp-dot.active{box-shadow:0 0 0 2px var(--card-bg,#fff),0 0 0 4px var(--primary,#2F80ED)}
    /* ═══ GLASSMORPHISM — Dark Mode Enhanced ═══ */
    html.dark .card,html.dark .slide-out .panel,html.dark .lead-panel,html.dark .tbl-toolbar,html.dark .kanban-col,html.dark .stat-card,html.dark .quick-card,html.dark .filter-panel,html.dark .lead-header,html.dark .lead-footer,html.dark .installment-item,html.dark .doc-item,html.dark .activity-item{background:var(--card-bg)!important;backdrop-filter:blur(12px) saturate(180%);-webkit-backdrop-filter:blur(12px) saturate(180%);border:1px solid var(--card-border);box-shadow:0 4px 20px rgba(0,0,0,.2),inset 0 1px 0 var(--glass-edge)}
    html.dark .card:hover,html.dark .quick-card:hover,html.dark .group-card:hover,html.dark .installment-item:hover,html.dark .doc-item:hover,html.dark .activity-item:hover{box-shadow:0 6px 28px var(--glass-glow),inset 0 1px 0 var(--glass-edge)}
    html.dark #sidebar,html.dark .top-bar,html.dark .content-footer,html.dark .sidebar-bottom{backdrop-filter:blur(16px) saturate(200%);-webkit-backdrop-filter:blur(16px) saturate(200%);background:var(--sidebar-bg)!important;border-color:var(--sidebar-border)}
    html.dark .notification-panel,html.dark .notif-list{backdrop-filter:blur(12px) saturate(180%);-webkit-backdrop-filter:blur(12px) saturate(180%);background:var(--card-bg)!important}
    html.dark .card-header{border-bottom-color:var(--glass-edge)!important}
    html.dark .s-grp-sep{background:var(--glass-edge)}
    html.dark .top-nav-item:hover{background:var(--hover-bg)!important}
    html.dark .top-nav-item.active{background:var(--active-bg)!important;color:var(--primary)}
    html.dark .sidebar-item:hover{background:var(--hover-bg)!important;color:var(--primary)}
    html.dark .sidebar-item.active{background:var(--active-bg)!important;color:var(--primary)}
    html.dark .toolbar .filter-btn,html.dark .toolbar .search-box,html.dark .form-input,html.dark select,html.dark .pagination .pg-btn{background:var(--input-bg)!important;border-color:var(--input-border);backdrop-filter:blur(8px) saturate(160%);-webkit-backdrop-filter:blur(8px) saturate(160%)}
    html.dark .col-menu{background:var(--card-bg)!important;border-color:var(--card-border);backdrop-filter:blur(20px) saturate(200%);-webkit-backdrop-filter:blur(20px) saturate(200%)}
    html.dark .group-card{background:var(--card-bg)!important;border-color:var(--card-border);backdrop-filter:blur(12px) saturate(180%);-webkit-backdrop-filter:blur(12px) saturate(180%)}
    html.dark .lead-panel{box-shadow:-4px 0 30px rgba(0,0,0,.4)}
    html.dark .slide-out .panel{box-shadow:-4px 0 30px rgba(0,0,0,.4)}
    html.dark .notif-item:hover{background:var(--hover-bg)!important}
    html.dark .notif-item.unread{background:var(--active-bg)!important}
    html.dark .kanban-card{background:var(--card-bg)!important;border-color:var(--card-border);backdrop-filter:blur(8px) saturate(160%);-webkit-backdrop-filter:blur(8px) saturate(160%)}

    /* ═══ MICRO-INTERACTIONS ═══ */
    button,.action-btn,.icon-btn,.tt-btn,.pg-btn,.tab,.fav-chip,.filter-btn{transition:transform .12s ease,background .15s ease,color .15s ease,border-color .15s ease,box-shadow .15s ease}
    button:not(.no-press):active,.action-btn:active,.icon-btn:active,.tt-btn:active,.pg-btn:active,.tab:active,.fav-chip:active,.filter-btn:active{transform:scale(.94)}
    .stat-card,.quick-card,.doc-item,.activity-item,.installment-item,.mm-mod{transition:transform .18s ease,box-shadow .18s ease}
    .stat-card:hover,.quick-card:hover,.doc-item:hover,.activity-item:hover,.installment-item:hover,.mm-mod:hover{transform:translateY(-2px);box-shadow:0 6px 18px rgba(0,0,0,.09)}

    /* column resize */

    .resizer::after{content:'';position:absolute;right:3px;top:18%;height:64%;width:2px;background:#c8cdd6;border-radius:1px;opacity:0;transition:opacity .15s}
    th:hover .resizer::after,.resizer.active::after{opacity:1}
    .resizer.active::after{background:#2F80ED}
    body.resizing{cursor:col-resize!important;user-select:none!important}
    body.resizing *{cursor:col-resize!important}

let DB = loadDB();
let currentView = 'dashboard';
let currentGroup = 'overview';

const GROUPS = [
  { id:'overview',  ico:'🏠', tip:'Overview',   mods:['dashboard'] },
  { id:'portfolio', ico:'🏢', tip:'Portfolio',  mods:['properties','units'] },
  { id:'tenancy',   ico:'👥', tip:'Tenancy',    mods:['tenants','leases'] },
  { id:'finance',   ico:'💰', tip:'Finance',    mods:['invoices','receipts','payments','taxes'] },
  { id:'ops',       ico:'🔧', tip:'Operations', mods:['maintenance','compliance'] },
  { id:'intel',     ico:'🤖', tip:'Intelligence', mods:['ai'] }
];
const MODS = {
  dashboard:{label:'Dashboard',   ico:'🏠', group:'overview'},
  properties:{label:'Properties', ico:'🏢', group:'portfolio'},
  units:{label:'Units',       ico:'🚪', group:'portfolio'},
  tenants:{label:'Tenants',    ico:'👤', group:'tenancy'},
  leases:{label:'Leases',      ico:'📄', group:'tenancy'},
  invoices:{label:'Invoices',   ico:'🧾', group:'finance'},
  receipts:{label:'Receipts',   ico:'📜', group:'finance'},
  payments:{label:'Payments',   ico:'💳', group:'finance'},
  taxes:{label:'Taxes',      ico:'🏦', group:'finance'},
  maintenance:{label:'Maintenance', ico:'🔧', group:'ops'},
  compliance:{label:'Compliance',  ico:'⚖️', group:'ops'},
  ai:{label:'AI Assistant', ico:'🤖', group:'intel'}
};
const QUICK_ACTIONS = [
  {ico:'🏢', label:'Add Property', fn:'openPropForm()'},
  {ico:'👤', label:'Add Tenant', fn:'openTenantForm()'},
  {ico:'📄', label:'Add Lease', fn:'openLeaseForm()'},
  {ico:'🧾', label:'Generate Invoice', fn:'openInvoiceForm()'},
  {ico:'🔧', label:'Report Maintenance', fn:'openTicketForm()'}
];

// ---------- persistence ----------
function loadDB(){
  try{
    const raw = localStorage.getItem('krtaker_db_v2');
    if(raw) return JSON.parse(raw);
  }catch(e){}
  return JSON.parse(JSON.stringify(SEED));
}
function saveDB(){ try{ localStorage.setItem('krtaker_db_v2', JSON.stringify(DB)); }catch(e){} }
function resetDB(){ DB = JSON.parse(JSON.stringify(SEED)); saveDB(); toast('Demo data reset','success'); nav(currentView); }

// ---------- utils ----------
function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function fmt(n){ return '\u09F3' + Number(n||0).toLocaleString('en-IN'); }
function today(){ return new Date().toISOString().slice(0,10); }
function uid(p){ return p + '-' + String(Date.now()).slice(-6); }
function toast(msg, type){
  const c = document.getElementById('toastContainer');
  const d = document.createElement('div');
  d.className = 'toast ' + (type||'');
  d.textContent = msg;
  c.appendChild(d);
  setTimeout(()=>{ d.style.opacity='0'; setTimeout(()=>d.remove(), 300); }, 2600);
}
function badge(status){
  const map = {'Active':'badge-active','Paid':'badge-active','Success':'badge-active','Leased':'badge-active','Open':'badge-new','Vacant':'badge-closed','Pending Registration':'badge-pending','Unpaid':'badge-pending','In Progress':'badge-pending','Overdue':'badge-sold','Expired':'badge-closed','Terminated':'badge-closed','Maintenance':'badge-reserved','Awaiting Payment':'badge-reserved','Landlord':'badge-sold','Tenant':'badge-closed'};
  return `<span class="badge-status ${map[status]||'badge-pending'}">${esc(status)}</span>`;
}
function statCards(list){
  return `<div class="stats-row">` + list.map(s=>
    `<div class="stat-card"><div class="label">${s[0]}</div><div class="value"${s[2]?` style="color:${s[2]}"`:''}>${s[1]}</div>${s[3]?`<div class="trend">${s[3]}</div>`:''}</div>`
  ).join('') + `</div>`;
}
function pageHeader(title, subtitle, actions){
  return `<div class="tbl-toolbar" style="justify-content:space-between;align-items:center">
    <div style="display:flex;align-items:baseline;gap:8px;flex-wrap:wrap"><span style="font-size:13px;font-weight:700;color:#222">${title}</span><span style="font-size:10.5px;color:#8895a7">${subtitle||''}</span></div>
    <div style="display:flex;gap:6px">${actions||''}</div></div>`;
}
function emptyState(msg){ return `<div style="padding:30px;text-align:center;color:#9aa5b1;font-size:11.5px">${msg}</div>`; }
function propertyById(id){ return DB.properties.find(p=>p.id===id); }
function unitById(id){ return DB.units.find(u=>u.id===id); }
function tenantById(id){ return DB.tenants.find(t=>t.id===id); }
function leaseById(id){ return DB.leases.find(l=>l.id===id); }
function leasesForUnit(uid){ return DB.leases.filter(l=>l.unit===uid && (l.status==='Active'||l.status==='Pending Registration')); }
function unitLabel(u){ return (propertyById(u.property)?.name||'?') + ' / ' + u.name; }

// ---------- modal ----------
function openModal(title, body, footer){
  document.getElementById('modalTitle').textContent = title;
  document.getElementById('modalBody').innerHTML = body;
  document.getElementById('modalFooter').innerHTML = footer||'';
  document.getElementById('modalOverlay').style.display = 'flex';
}
function closeModal(){ document.getElementById('modalOverlay').style.display = 'none'; }
function closeModalOnBackdrop(e){ if(e.target.id==='modalOverlay') closeModal(); }

// ---------- nav / groups / top nav ----------
function renderSidebar(){
  const h = GROUPS.map(g=>{
    const active = currentGroup===g.id;
    return `<div class="sidebar-item ${active?'active':''} has-children" data-tip="${g.tip}" onclick="switchGroup('${g.id}')" id="s_${g.id}">${g.ico}</div>`;
  }).join('<div class="s-grp-sep"></div>');
  document.getElementById('sidebarNav').innerHTML = h;
}
function renderTopNav(){
  const g = GROUPS.find(x=>x.id===currentGroup);
  document.getElementById('topNav').innerHTML = g.mods.map(mid=>{
    const m = MODS[mid];
    return `<div class="top-nav-item ${currentView===mid?'active':''}" onclick="nav('${mid}')">${m.ico} ${m.label}</div>`;
  }).join('');
}
function switchGroup(gid){
  currentGroup = gid;
  renderSidebar(); renderTopNav();
  const g = GROUPS.find(x=>x.id===gid);
  nav(g.mods[0]);
}
function openMobileNav(){
  const p = document.getElementById('mobileNavPanel');
  const groupsHtml = GROUPS.map(g=>`<div class="mnav-grp ${currentGroup===g.id?'active':''}" onclick="switchGroup('${g.id}'); renderMobileNavList();">${g.ico}</div>`).join('');
  p.innerHTML = `
    <div class="mnav-head"><span>KRTaker — Modules</span><span class="mnav-close" onclick="closeMobileNav()">✕</span></div>
    <div class="mnav-groups">${groupsHtml}</div>
    <div id="mnavListWrap"></div>`;
  renderMobileNavList();
  document.getElementById('mobileNavSheet').style.display = 'flex';
}
function renderMobileNavList(){
  const g = GROUPS.find(x=>x.id===currentGroup);
  const wrap = document.getElementById('mnavListWrap');
  if(!wrap) return;
  const mods = g.mods.map(mid=>{
    const m = MODS[mid];
    return `<div class="mnav-item ${currentView===mid?'active':''}" onclick="nav('${mid}'); closeMobileNav()">${m.ico} ${m.label}${currentView===mid?'<span class="mnav-check">✓</span>':''}</div>`;
  }).join('');
  wrap.innerHTML = `<div class="mnav-grp-label">${g.tip}</div><div class="mnav-list">${mods}</div>`;
}
function closeMobileNav(){ document.getElementById('mobileNavSheet').style.display = 'none'; }
function nav(id){
  currentView = id;
  const m = MODS[id];
  if(m && m.group !== currentGroup){ currentGroup = m.group; }
  renderSidebar(); renderTopNav();
  document.getElementById('mobileNavBtnLabel').textContent = m ? m.label : 'Dashboard';
  document.getElementById('footerGroup').textContent = m ? GROUPS.find(g=>g.id===m.group).tip : 'Overview';
  document.getElementById('footerModName').textContent = m ? m.label : 'Dashboard';
  window.scrollTo(0,0);
  const renderers = {
    dashboard: renderDashboard, properties: renderProperties, units: renderUnits,
    tenants: renderTenants, leases: renderLeases, invoices: renderInvoices,
    receipts: renderReceipts, payments: renderPayments, taxes: renderTaxes,
    maintenance: renderMaintenance, compliance: renderCompliance, ai: renderAI
  };
  (renderers[id]||renderDashboard)();
  if(window.location.hash !== '#'+id) history.replaceState(null,'','#'+id);
}
window.addEventListener('hashchange', ()=>{ const h=location.hash.slice(1); if(h && MODS[h]) nav(h); });

// ---------- global search ----------
function openSearchDropdown(){ openGlobalSearch(document.getElementById('gsInput').value||''); }
function openGlobalSearch(q){
  const dd = document.getElementById('searchDropdown');
  q = (q||'').trim();
  const res = [];
  if(q.length >= 2){
    const ql = q.toLowerCase();
    DB.properties.forEach(p=>{ if((p.name+' '+p.holding).toLowerCase().includes(ql)) res.push({ico:'🏢', t:p.name, s:p.id+' · '+p.jurisdiction, fn:`nav('properties'); openPropDetail('${p.id}')`}); });
    DB.tenants.forEach(t=>{ if(t.name.toLowerCase().includes(ql)) res.push({ico:'👤', t:t.name, s:t.id+' · '+t.nid, fn:`nav('tenants'); openTenantDetail('${t.id}')`}); });
    DB.leases.forEach(l=>{ if(l.id.toLowerCase().includes(ql)) res.push({ico:'📄', t:l.id, s:unitLabel(unitById(l.unit))+' · '+fmt(l.rent)+'/mo', fn:`nav('leases'); openLeaseDetail('${l.id}')`}); });
    DB.invoices.forEach(v=>{ if(v.id.toLowerCase().includes(ql)) res.push({ico:'🧾', t:v.id, s:leaseById(v.lease)?.id+' · '+v.month, fn:`nav('invoices')`}); });
    Object.values(MODS).forEach(m=>{ if(m.label.toLowerCase().includes(ql)) res.push({ico:m.ico, t:m.label+' module', s:'Go to module', fn:`nav('${Object.keys(MODS).find(k=>MODS[k]===m)}')`}); });
  } else {
    Object.values(MODS).forEach(m=>{ res.push({ico:m.ico, t:m.label, s:'Module', fn:`nav('${Object.keys(MODS).find(k=>MODS[k]===m)}')`}); });
  }
  const box = document.getElementById('gsResults');
  box.innerHTML = res.slice(0,10).map(r=>`<div style="display:flex;gap:8px;align-items:center;padding:7px 8px;border-radius:7px;cursor:pointer" onmouseover="this.style.background='#f2f6fc'" onmouseout="this.style.background=''" onclick="${r.fn}; closeGlobalSearch()">
    <span style="font-size:14px">${r.ico}</span><div style="flex:1;min-width:0"><div style="font-size:12px;font-weight:600">${esc(r.t)}</div><div style="font-size:10px;color:#8895a7">${esc(r.s)}</div></div></div>`).join('');
  document.getElementById('gsEmpty').style.display = res.length ? 'none' : 'block';
  document.getElementById('gsCount').textContent = res.length ? res.length + ' result(s)' : '';
  dd.style.display = 'flex';
}
function closeGlobalSearch(){ document.getElementById('searchDropdown').style.display='none'; }
function jumpFirstResult(){ const r=document.querySelector('#gsResults [onclick]'); if(r) r.click(); }
document.addEventListener('keydown', e=>{
  if((e.ctrlKey||e.metaKey) && e.key.toLowerCase()==='k'){ e.preventDefault(); const i=document.getElementById('gsInput'); i.focus(); i.select(); }
  if(e.key==='Escape'){ closeModal(); closeGlobalSearch(); closeQuickAdd(); closeMobileNav(); }
});

// ---------- footer controls ----------
let _zoom = 100, _fs = 13;
function fontStep(d){
  _fs = Math.min(17, Math.max(10, _fs + d));
  document.documentElement.style.fontSize = _fs + 'px';
  toast('Text size: ' + _fs + 'px');
}
function changeZoom(d){
  _zoom = Math.min(140, Math.max(70, _zoom + d));
  document.getElementById('zoomLabel').textContent = _zoom + '%';
  document.querySelector('.main-area').style.transform = `scale(${_zoom/100})`;
  document.querySelector('.main-area').style.transformOrigin = 'top left';
}
function resetZoom(){ _zoom = 100; document.getElementById('zoomLabel').textContent = '100%'; document.querySelector('.main-area').style.transform=''; }
function toggleFullScreen(){
  if(!document.fullscreenElement){ document.documentElement.requestFullscreen().catch(()=>{}); }
  else { document.exitFullscreen().catch(()=>{}); }
}

// ---------- smart table framework (REM-style) ----------
const T = {};
function tstate(mod){ if(!T[mod]) T[mod]={q:'',page:1,sort:null,dir:1,filt:'All',view:'list'}; return T[mod]; }
function tblSearch(mod, val){ const st=tstate(mod); st.q=val; st.page=1; nav(mod); }
function tblFilter(mod, f){ const st=tstate(mod); st.filt=f; st.page=1; nav(mod); }
function tblSort(mod, k){ const st=tstate(mod); if(st.sort===k) st.dir*=-1; else { st.sort=k; st.dir=1; } st.page=1; nav(mod); }
function tblPage(mod, p){ tstate(mod).page=p; nav(mod); }
function tblView(mod, v){ tstate(mod).view=v; nav(mod); }

function smartTable(mod, opts){
  const st = tstate(mod);
  let rows = opts.rows.filter(r => (st.filt==='All' || opts.filterMatch(r, st.filt)) && (!st.q || opts.search(r, st.q.toLowerCase())));
  if(st.sort){
    const c = opts.cols.find(x=>x.k===st.sort);
    if(c && c.sort){
      rows = [...rows].sort((a,b)=>{ const va=c.sort(a), vb=c.sort(b); return (va<vb?-1:va>vb?1:0)*st.dir; });
    }
  }
  const total = rows.length, ps = opts.pageSize||8, pages = Math.max(1, Math.ceil(total/ps));
  if(st.page > pages) st.page = pages;
  const slice = rows.slice((st.page-1)*ps, st.page*ps);

  // filter chips
  const chips = ['All', ...opts.filters].map(f=>{
    const cnt = f==='All' ? opts.rows.length : opts.rows.filter(r=>opts.filterMatch(r,f)).length;
    return `<span class="flt-chip ${st.filt===f?'on':''}" onclick="tblFilter('${mod}','${f}')">${f} <span style="opacity:.6">${cnt}</span></span>`;
  }).join('');

  // view toggle (list / grid)
  const viewChips = opts.grid ? `<div class="view-chips" style="margin:0"><span class="view-chip-title">View:</span>
    <span class="view-chip ${st.view==='list'?'on':''}" onclick="tblView('${mod}','list')">☰ List</span>
    <span class="view-chip ${st.view==='grid'?'on':''}" onclick="tblView('${mod}','grid')">▦ Grid</span></div>` : '';

  // toolbar
  const toolbar = `<div class="tbl-toolbar">
    <div class="search-box"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#999" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg><input placeholder="Search ${opts.title.toLowerCase()}..." value="${esc(st.q)}" oninput="tblSearch('${mod}',this.value)"></div>
    ${viewChips}
    <span class="spacer" style="flex:1"></span>
    <span class="flt-count">${total} record(s)</span>
    <button class="filter-btn ${st.filt!=='All'?'on':''}" onclick="document.getElementById('fltBar_${mod}').style.display = document.getElementById('fltBar_${mod}').style.display==='none'?'flex':'none'">⚙ Filters${st.filt!=='All'?' ('+st.filt+')':''}</button>
  </div>
  <div class="flt-bar" id="fltBar_${mod}" style="${st.filt!=='All'?'':'display:none'}">${chips}</div>`;

  // body: grid or table
  let body = '';
  if(opts.grid && st.view==='grid'){
    body = slice.length ? `<div class="grid-cards">${slice.map(opts.grid).join('')}</div>` : emptyState(opts.empty||'Nothing found');
  } else {
    const thead = opts.cols.map(c=>{
      const arrow = st.sort===c.k ? (st.dir===1?'▲':'▼') : '⇅';
      return `<th class="${c.sort?'sortable':''}" ${c.sort?`onclick="tblSort('${mod}','${c.k}')"`:''}>${c.label}${c.sort?`<span class="s-arrow" style="color:${st.sort===c.k?'#2F80ED':'#bbb'}">${arrow}</span>`:''}</th>`;
    }).join('');
    const trows = slice.map(r=>`<tr ${opts.rowClick?`onclick="${opts.rowClick(r)}" style="cursor:pointer"`:''}>${opts.cols.map(c=>`<td>${c.render(r)}</td>`).join('')}</tr>`).join('');
    body = `<div class="table-wrap"><table class="table-view"><thead><tr>${thead}</tr></thead><tbody>${trows||`<tr><td colspan="${opts.cols.length}">${emptyState(opts.empty||'Nothing found')}</td></tr>`}</tbody></table></div>`;
  }

  // pagination
  const pgBtns = [];
  const win = 3;
  for(let p=1; p<=pages; p++){
    if(pages>7 && p>1+win && p<pages-win){ if(pgBtns[pgBtns.length-1]!=='…') pgBtns.push('…'); continue; }
    pgBtns.push(p);
  }
  const pag = pages>1 ? `<div class="pagination">
    <span class="pg-info">Page ${st.page} of ${pages} · ${total} record(s)</span>
    <button class="pg-btn" ${st.page>1?`onclick="tblPage('${mod}',${st.page-1})"`:''} ${st.page===1?'disabled style="opacity:.4"':''}>‹</button>
    ${pgBtns.map(p=>p==='…'?`<span style="color:#999">…</span>`:`<button class="pg-btn ${p===st.page?'pg-active':''}" onclick="tblPage('${mod}',${p})">${p}</button>`).join('')}
    <button class="pg-btn" ${st.page<pages?`onclick="tblPage('${mod}',${st.page+1})"`:''} ${st.page===pages?'disabled style="opacity:.4"':''}>›</button>
  </div>` : '';

  return `<div class="card" style="margin-top:10px">
    ${toolbar}
    ${body}
    ${pag}
  </div>`;
}

// ---------- dashboard ----------
function renderDashboard(){
  const activeLeases = DB.leases.filter(l=>l.status==='Active');
  const pendingReg = DB.leases.filter(l=>l.status==='Pending Registration');
  const occupied = DB.units.filter(u=>u.status==='Leased').length;
  const totalUnits = DB.units.length;
  const portValue = DB.properties.reduce((s,p)=>s+p.value,0);
  const rentDue = DB.invoices.filter(v=>v.status==='Unpaid'||v.status==='Overdue').reduce((s,v)=>s+v.gross,0);
  const openTickets = DB.tickets.filter(t=>t.status==='Open'||t.status==='In Progress').length;
  const due30 = DB.invoices.filter(v=>v.status==='Overdue').reduce((s,v)=>s+v.gross,0);

  let h = pageHeader('Overview', 'Portfolio at a glance — rent roll, compliance & AI caretaker', `<button class="action-btn ghost" onclick="openQuickAdd()">＋ Quick add</button><button class="action-btn primary" onclick="nav('ai')">🤖 Ask KR</button>`);
  h += statCards([
    ['Portfolio Value', fmt(portValue), '#2F80ED', '৳'+(portValue/1e7).toFixed(1)+' Cr'],
    ['Units', totalUnits+' ('+occupied+' leased)', '#27ae60', Math.round(occupied/totalUnits*100)+'% occupancy'],
    ['Rent Due (Jun–Jul)', fmt(rentDue), '#e67e22', 'Overdue '+fmt(due30)],
    ['Leases Pending Registration', pendingReg.length, pendingReg.length?'#e74c3c':'#27ae60', 'Legal gate active'],
    ['Open Tickets', openTickets, '#9b59b6', DB.tickets.filter(t=>t.liability==='Landlord'&&t.status==='Open').length+' landlord-side']
  ]);

  const occBars = DB.properties.map(p=>{
    const us = DB.units.filter(u=>u.property===p.id);
    const oc = us.filter(u=>u.status==='Leased').length;
    const pct = us.length ? Math.round(oc/us.length*100) : 0;
    return `<div style="margin:6px 0"><div style="display:flex;justify-content:space-between;font-size:10.5px;color:#667;margin-bottom:3px"><span>${esc(p.name)}</span><span>${oc}/${us.length} · ${pct}%</span></div>
      <div style="height:7px;background:#eef1f5;border-radius:4px"><div style="height:7px;width:${pct}%;background:${pct>80?'#27ae60':pct>40?'#2F80ED':'#e67e22'};border-radius:4px"></div></div></div>`;
  }).join('');

  const acts = [
    {t:'Payment received', d:'RCP-0004 · ৳40,000 via Nagad', when:'Jun 12'},
    {t:'Payment received', d:'RCP-0003 · ৳405,000 via bKash (TDS ৳45,000 split)', when:'Jun 10'},
    {t:'Lease flagged', d:'L-004 (>12mo) → Pending Registration — Sub-registry doc required', when:'Jun 08'},
    {t:'Maintenance ticket', d:'MT-004 · flooring damage liability → Tenant', when:'Jun 27'},
    {t:'AI action', d:'Generated rent reminder for INV-2026-006 (L-006)', when:'Jun 20'}
  ];
  const actList = acts.map(a=>`<div class="activity-item" style="display:flex;gap:10px;align-items:flex-start;padding:7px 0;border-bottom:1px solid #f4f6f9">
    <div style="width:26px;height:26px;border-radius:7px;background:#eef6ff;display:flex;align-items:center;justify-content:center;font-size:12px;flex-shrink:0">${a.t.startsWith('Payment')?'💳':a.t.startsWith('Lease')?'⚖️':a.t.startsWith('AI')?'🤖':'🔧'}</div>
    <div style="flex:1;min-width:0"><div style="font-size:11.5px;font-weight:600">${a.t}</div><div style="font-size:10.5px;color:#667">${a.d}</div></div>
    <div style="font-size:9.5px;color:#9aa5b1">${a.when}</div></div>`).join('');

  h += `<div class="dash-grid" style="margin-top:14px">
    <div class="card"><div class="card-header">Occupancy by Property</div><div class="card-body">${occBars}</div></div>
    <div class="card"><div class="card-header">Recent Activity</div><div class="card-body" style="padding:4px 14px">${actList}</div></div>
    <div class="card"><div class="card-header">Compliance Snapshot</div><div class="card-body">
      <div style="font-size:11px;line-height:1.9">
        <div>⚖️ <b>${pendingReg.length}</b> lease${pendingReg.length>1?'s':''} pending registration (TPA 1882 §107)${pendingReg.length?` — <a href="javascript:nav('compliance')" style="color:#2F80ED">review</a>`:''}</div>
        <div>🏠 <b>${DB.leases.filter(l=>l.residential && l.advance>l.rent).length}</b> residential lease(s) exceed 1-month advance cap (PRCA 1991 §10/§23)</div>
        <div>📅 <b>${DB.leases.filter(l=>l.status==='Active'&&l.end<today()).length}</b> lease(s) expired or ending soon</div>
        <div>🧾 <b>${DB.invoices.filter(v=>v.tds>0).length}</b> invoices with TDS split (Income Tax Act 2023)</div>

// === KRTaker: leases (legal gates), invoices (TDS), receipts, maintenance ===

// ---------- legal engines ----------
function leaseMonths(l){ return Math.max(1, Math.round((new Date(l.end)-new Date(l.start))/2592000000)); }
function registrationGate(l){
  const months = leaseMonths(l);
  if(months > 12 && !l.regMeta) return {block:true, msg:`Duration ${months} months > 12 — TPA 1882 §107 + Registration Act §17(1)(d) require a registered instrument. Ledger stays inactive until sub-registry details are uploaded.`};
  if(months > 12 && l.regMeta) return {block:false, note:'Registered instrument verified.'};
  return {block:false, note:''};
}
function prcaAdvanceFlag(l){
  if(l.residential && l.advance > l.rent) return {flag:true, msg:`Advance ${fmt(l.advance)} exceeds 1 month rent (${fmt(l.rent)}) — PRCA 1991 §10/§23 requires rent-controller written consent. Manual override allowed for commercial.`};
  return {flag:false, msg:''};
}
function prcaRevisionFlag(l){
  const months = leaseMonths(l);
  if(months >= 24) return {flag:true, msg:`PRCA 1991 §15/§16 — rent can generally only be revised every 2 years. Future revision on this lease will be flagged.`};
  return {flag:false, msg:''};
}
function tdsFor(lease){
  const t = tenantById(lease.tenant);
  if(t && t.kind === 'Corporate'){
    const u = unitById(lease.unit);
    const p = propertyById(u?.property);
    const section = (p && p.type==='Commercial') ? '§128' : '§109';
    const rate = (p && p.type==='Commercial') ? 0.04 : 0.10;
    return {rate, section};
  }
  return {rate:0, section:''};
}
function holdingTaxCalc(p){
  const us = DB.units.filter(u=>u.property===p.id);
  const ls = DB.leases.filter(l=>us.some(u=>u.id===l.unit) && (l.status==='Active'||l.status==='Pending Registration'));
  const gar = ls.reduce((s,l)=>s+l.rent*12,0);
  const allowance = gar/6;                       // 2 months of rent ≈ 16.67%
  const interest = p.mortgage ? p.mortgage.interest : 0;
  const nav = Math.max(0, gar - allowance - interest);
  const rate = { 'Dhaka North':0.08, 'Dhaka South':0.075, 'Chattogram':0.07, 'Gazipur':0.07 }[p.jurisdiction] || 0.06;
  return {gar, allowance, interest, nav, rate, tax: Math.round(nav*rate)};
}
function evictionEligible(tenantId){
  const overdue = DB.invoices.filter(v=>{
    const l = leaseById(v.lease); return l && l.tenant===tenantId && v.status==='Overdue';
  });
  const months = overdue.length;
  return {eligible: months>=3, months, msg: months>=3 ? `Tenant has ${months} months of unpaid rent — eviction grounds under PRCA 1991 §18 met. Generate compliant notice (§114A procedure).` : `${months} month(s) unpaid — §18 eviction grounds require ≥ 3 months.`};
}

  const l = leaseById(id); if(!l) return;
  const u = unitById(l.unit); const t = tenantById(l.tenant);
  const g = registrationGate(l);
  const pa = prcaAdvanceFlag(l);
  const pr = prcaRevisionFlag(l);
  const td = tdsFor(l);

    </div>`;

  if(pr.flag) h += `<div class="compliance-flag">${pr.msg}</div>`;
  if(evict.eligible) h += `<div class="compliance-block">${evict.msg}</div>`;
  h += `<div style="font-weight:700;margin:12px 0 6px">Invoices</div>`;

  h += `</div>`;
  let footer = `<button class="drawer-btn secondary" onclick="closeModal(); openLeaseForm('${l.id}')">Edit</button>`;
  if(g.block) footer += `<button class="drawer-btn primary" onclick="closeModal(); openRegistrationForm('${l.id}')">Upload Registration</button>`;
  else footer += `<button class="drawer-btn primary" onclick="generateInvoiceForLease('${l.id}')">Generate Invoice</button>`;

function saveLease(id){
  const g = x => document.getElementById(x).value;
  const unit = g('lf_unit'), tenant = g('lf_tenant');
  const start = g('lf_start'), end = g('lf_end');
  const rent = Number(g('lf_rent'))||0, advance = Number(g('lf_advance'))||0;
  const residential = g('lf_res')==='true';
  if(!unit||!tenant||!start||!end||!rent){ toast('Unit, tenant, dates and rent are required','error'); return; }
  if(new Date(end) <= new Date(start)){ toast('End date must be after start date','error'); return; }
  const months = Math.round((new Date(end)-new Date(start))/2592000000);
  const data = {unit, tenant, start, end, rent, advance, residential,
    regMeta: id? leaseById(id).regMeta : null,
    status: months>12 ? 'Pending Registration' : 'Active'};
  if(id){ Object.assign(leaseById(id), data); toast('Lease updated','success'); }
  else { DB.leases.push(Object.assign({id:uid('L')}, data)); }
  saveDB(); closeModal(); renderLeases();
  if(months>12){ toast('Lease >12 months — pending registration (TPA §107)','error'); }
  else toast('Lease saved','success');
}

function resolveLiability(unitId, desc){
  const u = unitById(unitId); const p = propertyById(u?.property);
  const d = (desc||'').toLowerCase();
  const structural = /roof|structure|crack|wall|foundation|pump|electrical|plumbing main|common line|sewage|drain/i;
  const daily = /leak|bulb|clean|door lock|faucet|switch|fixture/i;
  if(structural.test(d) || p?.type==='Industrial' && /flooring|shed/.test(d)) return 'Landlord';
  if(daily.test(d)) return 'Tenant';
  return 'Landlord';
}

function addMsg(role, text, tools){
  DB.ai_log.push({role, text, tools, ts:new Date().toISOString().slice(0,16).replace('T',' ')});
  saveDB();
}
function resetChat(){ DB.ai_log = [{role:'ai', text:'Hello 👋 I\'m KR — your AI property caretaker. Ask me about leases, taxes, PRCA compliance, or say "generate invoice for L-003" and I\'ll take action.', ts:new Date().toISOString().slice(0,16).replace('T',' ')}]; saveDB(); renderAI(); }
function sendChat(){ const i=document.getElementById('chatInput'); if(i.value.trim()) sendChatText(i.value.trim()); i.value=''; }
function sendChatText(text){
  addMsg('user', text); renderAI();
  const reply = aiAnswer(text);
  setTimeout(()=>{ addMsg('ai', reply.text, reply.tools); renderAI(); }, 350);
}
function aiAnswer(q){
  const s = q.toLowerCase();
  const L = DB.leases, I = DB.invoices, P = DB.properties;
  let m = s.match(/invoice\s+(for\s+)?(l-\d+)/i);
  if(m && /generat|create|make|issue|bill/.test(s)){
    const l = L.find(x=>x.id.toLowerCase()===m[2].toLowerCase());
    if(!l) return {text:'Lease '+m[2]+' not found. Active leases: '+L.filter(x=>x.status==='Active').map(x=>x.id).join(', '), tools:[]};
    const td = tdsFor(l);
    const gross = l.rent, tds = Math.round(gross*td.rate), net = gross-tds;
    const inv = {id:'INV-2026-'+String(I.length+1).padStart(3,'0'), lease:l.id, month:today().slice(0,7), gross, tdsRate:td.rate, tds, net, status:'Unpaid'};
    I.push(inv); saveDB();
    return {text:'✅ Generated '+inv.id+' for '+l.id+' — gross '+fmt(gross)+(td.rate?', TDS '+fmt(tds)+' ('+td.section+'), net '+fmt(net):'')+'. Tenant: '+tenantById(l.tenant).name+'.', tools:['generate_invoice()']};
  }
  if(/report|ticket|issue|plumbing|leak|maintenance/.test(s) && /leak|plumb|roof|crack|fix|repair|maintenance|broken|pump/.test(s)){
    const u = DB.units[0];
    const desc = s.replace(/.*?(report|ticket|issue)\s*/i,'').slice(0,80) || 'Reported via AI chat';
    const liab = resolveLiability(u.id, desc);
    DB.tickets.push({id:uid('MT'), unit:u.id, desc, reported:today(), liability:liab, status:'Open', contractor:'', cost:0, note:'via KR'});
    saveDB();
    return {text:'🔧 Ticket '+DB.tickets[DB.tickets.length-1].id+' created for '+unitLabel(u)+'. Liability resolver → '+liab+' responsibility (per lease + PRCA defaults).', tools:['create_maintenance_ticket()','resolve_liability()']};
  }
  if(/rent due|outstanding|who owes|unpaid/.test(s)){
    const due = I.filter(v=>v.status==='Unpaid'||v.status==='Overdue');
    if(!due.length) return {text:'Nothing outstanding — all invoices settled 🎉', tools:[]};
    const lines = due.map(v=>{ const l=L.find(x=>x.id===v.lease); return v.id+' · '+tenantById(l.tenant).name+' · '+fmt(v.net)+(v.tds?' (net of TDS)':''); }).join('\n');
    return {text:'You have '+due.length+' outstanding invoice(s), total '+fmt(due.reduce((s,v)=>s+v.net,0))+':\n'+lines, tools:['query_invoices()']};
  }
  if(/holding tax|annual value/.test(s)){
    const p = P[0];
    const r = holdingTaxCalc(p);
    return {text:'Holding tax for '+p.name+' ('+p.jurisdiction+'):\n1) Gross Annual Rent: '+fmt(r.gar)+'\n2) − Maintenance allowance (2 mo): '+fmt(r.allowance)+'\n3) − Mortgage interest: '+fmt(r.interest)+'\n4) Net Annual Value: '+fmt(r.nav)+' → tax ≈ '+fmt(r.tax)+'/yr at '+(r.rate*100).toFixed(1)+'%.', tools:['calc_holding_tax()']};
  }
  if(/tds|withholding/.test(s)){
    const corp = L.filter(l=>tenantById(l.tenant)?.kind==='Corporate' && (l.status==='Active'||l.status==='Pending Registration'));
    if(!corp.length) return {text:'No corporate tenancies — TDS not applicable on individual rent.', tools:[]};
    const lines = corp.map(l=>{ const td=tdsFor(l); return l.id+' · '+tenantById(l.tenant).name+' · '+(td.rate*100).toFixed(0)+'% ('+td.section+')'; }).join('\n');
    return {text:'TDS applies to corporate tenants (Income Tax Act 2023):\n'+lines+'\n\nCommercial lease collections: 4% (§128) · general rental: 10% (§109).', tools:['tds_lookup()']};
  }
  if(/advance|deposit|security/.test(s)){
    const bad = L.filter(l=>l.residential && l.advance>l.rent);
    if(!bad.length) return {text:'All residential leases comply — advance ≤ 1 month rent (PRCA 1991 §10/§23). ✓', tools:['prca_check()']};
    return {text:'⚠ '+bad.length+' residential lease(s) exceed the 1-month advance cap:\n'+bad.map(l=>l.id+' · '+tenantById(l.tenant).name+' · advance '+fmt(l.advance)+' vs rent '+fmt(l.rent)).join('\n')+'\nRequires rent-controller written consent or commercial override.', tools:['prca_check()']};
  }
  if(/evict|eviction/.test(s)){
    const elig = DB.tenants.map(t=>({t,e:evictionEligible(t.id)})).filter(x=>x.e.eligible);
    if(!elig.length) return {text:'No tenant currently meets the ≥3-month unpaid threshold for §18 eviction grounds. Digital lockouts are never performed.', tools:['eviction_check()']};
    return {text:'⚠ '+elig.map(x=>x.t.name+' ('+x.e.months+' mo unpaid)').join(', ')+' — grounds met. I can generate a compliant §114A notice.', tools:['eviction_check()']};
  }
  if(/liab|who.*(pay|fix|responsible)|roof|structural/.test(s)){
    return {text:'Liability rule (PRCA 1991): structural/maintenance = Landlord; day-to-day = Tenant. Open tickets:\n'+DB.tickets.filter(t=>t.status!=='Closed').map(t=>t.id+' · '+t.desc.slice(0,40)+' → '+t.liability).join('\n'), tools:['resolve_liability()']};
  }
  if(/registr/.test(s)){
    const pr = L.filter(l=>l.status==='Pending Registration');
    return {text: pr.length? '⚠ '+pr.length+' lease(s) pending registration (TPA 1882 §107): '+pr.map(l=>l.id+' ('+leaseMonths(l)+' mo)').join(', ')+'. Ledgers stay inactive until sub-registry docs uploaded.' : 'All leases >12 months have registered instruments ✓', tools:['registration_gate()']};
  }
  if(/legal|law|act|section|prca|tpa|allowed/.test(s)){
    return {text:'⚖️ Under PRCA 1991 §18, a tenant paying allowable rent cannot be summarily evicted; eviction needs a court decree on specific grounds (e.g. 3 months unpaid). §10/§23 cap residential advance at 1 month rent without rent-controller consent. TPA 1882 §107 + Registration Act §17(1)(d) make leases >12 months invalid without a registered instrument.\n\n(Phase 5: full RAG retrieval over statute texts via DeepSeek embeddings.)', tools:['rag_retrieve()']};
  }
  return {text:'I can help with: rent due status · TDS rates · holding tax · PRCA advance/eviction rules · lease registration · maintenance liability · generating invoices & tickets.\n\nTry one of the suggestions above, or ask e.g. "Generate invoice for L-004".', tools:[]};
}
