<div class="auth-page">
  <div class="container">
    <div class="auth-card" style="max-width:440px">
      <div class="auth-header">
        <span class="auth-icon">🔐</span>
        <h1>Welcome back</h1>
        <p>Log in to your KRTaker workspace</p>
      </div>
      <form id="loginForm">
        <div class="form-group">
          <label>Email address</label>
          <input type="email" placeholder="you@example.com" required>
        </div>
        <div class="form-group">
          <label>Password</label>
          <input type="password" placeholder="••••••••" required>
        </div>
        <button type="submit" class="btn btn-primary btn-block btn-lg">Log in</button>
        <p class="terms-note"><a href="forgot-password.html">Forgot password?</a></p>
      </form>
      <div class="auth-footer">
        <p>New to KRTaker? <a href="register.html">Create an account</a></p>
      </div>
      <div class="auth-feats">
        <span>Demo: any credentials → workspace</span>
      </div>
    </div>
  </div>
</div>
