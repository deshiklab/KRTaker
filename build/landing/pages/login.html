<div class="auth-page">
  <div class="container">
    <div class="auth-card" style="max-width:440px">
      <div class="auth-header">
        <span class="auth-icon">🔐</span>
        <h1 data-i18n="login.title">Welcome back</h1>
        <p data-i18n="login.sub">Log in to your KRTaker workspace</p>
      </div>
      <form id="loginForm">
        <div class="form-group">
          <label data-i18n="login.email">Email address</label>
          <input type="email" placeholder="you@example.com" required>
        </div>
        <div class="form-group">
          <label data-i18n="login.pass">Password</label>
          <input type="password" placeholder="••••••••" required>
        </div>
        <button type="submit" data-i18n="login.btn" class="btn btn-primary btn-block btn-lg">Log in</button>
        <p class="terms-note"><a href="forgot-password.html">Forgot password?</a></p>
      </form>
      <div class="auth-footer">
        <p><span data-i18n="login.noacct">New to KRTaker?</span> <a href="register.html"><span data-i18n="login.signup">Create an account</span></a></p>
      </div>
      <div class="auth-feats">
        <span>Demo: any credentials → workspace</span>
      </div>
    </div>
  </div>
</div>
